function setBp(bpName, key, value, rebuild = true){
  if (value === null) queuePatch(["blueprints", bpName, key], null, "delete");
  else queuePatch(["blueprints", bpName, key], value);
  refreshEditor(bpName, rebuild);
}
function setBpLabel(bpName, v){
  // blur-committed text field: no dialog rebuild (see refreshEditor)
  const bp = (S.profile.blueprints || {})[bpName] || {};
  const val = (v || "").trim();
  if (val) queuePatch(["blueprints", bpName, "label"], val);
  else if (bp.label !== undefined) queuePatch(["blueprints", bpName, "label"], null, "delete");
  else dropPending([["blueprints", bpName, "label"]]);
  refreshEditor(bpName, false);
}
/* A weapon plan is a library entry; what it NEEDS is decided where a run
   binds it (the compiler refuses the binding, never the definition). Grey
   the plans this account cannot bind yet and say why, before the validator
   has to: a Chain Lightning schedule (any mode but off) needs the weapon
   (player.uws.chain_lightning), which Full setup proves from the in-run UW
   panel and "Use discovered presets" writes into the profile. */
function uwPlanBlocked(name){
  const plan = (((S.profile || {}).policies || {}).uw_policies || {})[name] || {};
  const mode = (plan.chain_lightning || {}).mode;
  if (mode == null || mode === "off") return "";
  if ((((S.profile || {}).player || {}).uws || {}).chain_lightning) return "";
  return `Schedules Chain Lightning (mode ${mode}), which this account does not own yet ` +
    `(player.uws.chain_lightning). If the account has it: run Full setup, then ` +
    `"Use discovered presets in my profile" on Calibrate.`;
}
function setBpPolicy(bpName, pkey, value){
  if (value === "") queuePatch(["blueprints", bpName, "policies", pkey], null, "delete");
  else queuePatch(["blueprints", bpName, "policies", pkey], value);
  refreshEditor(bpName);
}
function useGlobalGather(bpName){
  queuePatch(["blueprints", bpName, "policies", "gather"], null, "delete");
  refreshEditor(bpName);
}
function useLocalGather(bpName){
  const localName = bpName + "_gather";
  const pol = (S.profile.policies || {}).gather || {};
  if (!pol[localName])
    queuePatch(["policies", "gather", localName], deep(SEEDS.templates.gather));
  queuePatch(["blueprints", bpName, "policies", "gather"], localName);
  refreshEditor(bpName);
}
function setLocalGather(bpName, key, value){
  // whole-policy write: the queue holds one coherent object per policy, so
  // the eventual save is a single validated patch
  const localName = bpName + "_gather";
  const body = deep(((S.profile.policies || {}).gather || {})[localName]
                    || SEEDS.templates.gather);
  body[key] = key === "gem_orbit" ? {...(body.gem_orbit || {}), enabled:value} : value;
  queuePatch(["policies", "gather", localName], body);
  refreshEditor(bpName);
}
function refreshEditor(bpName, rebuild = true){
  // rebuild:false for blur-committed inputs - rebuilding the dialog mid
  // change event destroys a Save/Cancel button the user is clicking (see
  // p2Save). The cards behind the dialog always re-render.
  const ed = $("#editor");
  if (rebuild && ed && ed.open) {
    const advanced = !!$("#run-advanced")?.open;
    ed.innerHTML = editorHtml(bpName);
    if ($("#run-advanced")) $("#run-advanced").open = advanced;
  }
  renderFlows(); renderDay(); renderBehaviors();
}

/* ================================================= POLICY EDITORS (glass)
   Rescue rules, shopping priorities and ultimate-weapon scheduling, edited
   in place. All three keep a working DRAFT, write the WHOLE policy object
   per change, and let the compiler's validator veto - verdict verbatim. */
const P2 = { kind:null, name:null, bp:null, draft:null };
const P2_SECTION = { rescue:"rescue_policies", shop:"shopping_lists",
                     uw:"uw_policies", gather:"gather" };

function p2Load(){
  P2.draft = JSON.parse(JSON.stringify(
    ((S.profile.policies || {})[P2_SECTION[P2.kind]] || {})[P2.name] || {}));
}
/* stage only - the whole-policy draft goes into the pending queue; the
   validator sees it once, at Save, as one coherent object.

   `rebuild:false` is for blur-committed fields (text/number inputs): their
   change event fires BETWEEN mousedown and click when the user goes
   straight for Save ✓, and rebuilding the dialog's innerHTML right then
   destroys the pressed button - the click never lands and the edit looks
   saved but dies with the dialog (the tourney_cl rename, 2026-08-27).
   Those fields already display what was typed; only structural changes
   (mode/kind switches, add/move/delete) need the rebuild. */
function p2Save(rebuild = true){
  queuePatch(["policies", P2_SECTION[P2.kind], P2.name], P2.draft);
  if (rebuild) p2Render();
  if (P2.bp) { const ed = $("#editor"); if (ed.open) ed.innerHTML = editorHtml(P2.bp); }
  renderBehaviors();
}
function p2Cancel(){
  dropPending([["policies", P2_SECTION[P2.kind], P2.name]]);
  $("#editor2").close();
  if (P2.bp) { const ed = $("#editor"); if (ed.open) ed.innerHTML = editorHtml(P2.bp); }
  renderBehaviors();
}
async function p2Commit(){
  if (await saveAll()) $("#editor2").close();
}
const DISSONANT_TAB_LABEL = { attack:"Attack", defense:"Defense", utility:"Utility",
                              ultimate_weapons:"Ultimate Weapons" };
function dissonantTabs(){
  // the compiler's value space when the vocabulary carries it, else the
  // four workshop tabs the game has
  const spec = (((((S.vocab || {}).blueprint_fields || {}).fields || {}).coin || {}).fields || {}).dissonant_tab;
  return (spec && spec.values) || Object.keys(DISSONANT_TAB_LABEL);
}
function dissonantTabLabel(k){ return DISSONANT_TAB_LABEL[k] || k; }
function perkLines(v){ return String(v || "").split("\n").map(s => s.trim()).filter(Boolean); }
function setBpLines(bpName, key, v){ setBp(bpName, key, perkLines(v), false); }
function bpKindLabel(b){
  // what the badge says: the flow's label - except that a coin-flow run
  // with a dissonant workshop tab is an ACHIEVEMENT run, not coin farming
  // (user, 2026-09-06)
  const spec = (S.flows || {})[(b || {}).kind] || {};
  if ((b || {}).kind === "coin" && b.dissonant_tab)
    return `Achievement run (${b.dissonant_tab} dissonance)`;
  return spec.label || (b || {}).kind || "";
}
function bpOptionText(name, b){
  // "Shard farming (daily) · Shard farming" - the kind after the name,
  // unless the name already IS the kind's label
  const kind = bpKindLabel(b);
  const label = bpLabel(name);
  return label.toLowerCase() === kind.toLowerCase() ? label : `${label} · ${kind}`;
}
function bpLabel(name){
  // a run type's display name (blueprint `label`, what the tray and the run
  // log already call it); the identifier when it has none
  if (!name) return name;
  const b = ((S.profile || {}).blueprints || {})[name];
  return (b && b.label) || name;
}
function polLabel(sec, name){
  if (!name) return name;
  const p = ((S.profile.policies || {})[sec] || {})[name];
  return (p && p.label) || name;
}
function p2SetLabel(v){
  if (v.trim()) P2.draft.label = v.trim(); else delete P2.draft.label;
  p2Save(false);
}
function p2Render(){
  const dlg = $("#editor2");
  dlg.innerHTML = P2.kind === "rescue" ? rescueHtml()
                : P2.kind === "shop"   ? shopHtml()
                : P2.kind === "gather" ? gatherHtml() : uwHtml();
  if (!dlg.open) dlg.showModal();
  syncSaveBar();
}
function openRescueEditor(name, bp){ P2.kind = "rescue"; P2.name = name; P2.bp = bp; p2Load(); p2Render(); }
function openShopEditor(name, bp){ P2.kind = "shop"; P2.name = name; P2.bp = bp; p2Load(); p2Render(); }
function openUwEditor(name, bp){ P2.kind = "uw"; P2.name = name; P2.bp = bp; p2Load(); p2Render(); }
function openGatherEditor(name, bp){ P2.kind = "gather"; P2.name = name; P2.bp = bp; p2Load(); p2Render(); }

function gatherHtml(){
  const d = P2.draft;
  const sw = (key, label, hint) => `<label class="inline">
    <input type="checkbox" ${d[key] ? "checked" : ""}
      onchange="p2field('${key}', this.checked)"> ${label}
    ${hint ? `<span class="muted">${hint}</span>` : ""}</label>`;
  return `<article>${p2Header("gathering")}
    <fieldset><legend>Pick up while a run is live</legend>
      ${sw("ad_gems", "Claim Ad Gems on the battle screen")}
      ${sw("free_store_gems", "Claim free gems in the Store")}
      ${sw("guild_store", "Buy items with guild currency after collecting rewards")}
      <label class="inline"><input type="checkbox" ${d.gem_orbit?.enabled ? "checked" : ""}
        onchange="p2field('gem_orbit', {...(P2.draft.gem_orbit || {}), enabled:this.checked})">Collect rotating diamonds with timed clicks (no image matching)</label>
      ${sw("quests_8h", "Claim the 8-hour quest chest")}
      ${sw("quest_rewards", "Claim finished quests")}
      ${sw("guild", "Guild collection")}
    </fieldset>
    <p class="muted">Reward flows only ever navigate menus the bot itself
      opened, and back off when a visit claims nothing.</p></article>`;
}
/* ---- generic param rendering off the vocab specs */
function pInput(spec, val, js){
  if ((spec.values || []).length && spec.type !== "bool")
    return `<select onchange="${js}(this.value)">
      ${spec.values.map(v => `<option ${String(val) === String(v) ? "selected" : ""}>${esc(v)}</option>`).join("")}
    </select>`;
  if (spec.type === "bool")
    return `<input type="checkbox" ${val ? "checked" : ""} onchange="${js}(this.checked)">`;
  return `<input type="number" step="any" title="${esc(spec.doc || "")}"
    value="${val ?? ""}" onchange="${js}(this.value === '' ? null : Number(this.value))">`;
}

/* ---- RULE model: source spellings <-> {kind, params} */
const TRIG_LABEL = { bar:"a bar is low / falling", wall_collapse:"the wall collapses",
  fleet_mark:"a fleet spawns", wave_at_least:"wave is reached",
  wave_between:"between two waves", second_wind:"Second Wind state",
  death_screen:"the run just ended" };
const ACT_LABEL = { burst:"emergency burst (sprint→confirm→ability)",
  fire:"fire an ability", toggle_uw:"switch a weapon on/off",
  cancel_sprint:"end the intro sprint", surrender_retry:"surrender & retry",
  stop_after_run:"stop after this run" };
const FLAG_ACTS = ["cancel_sprint", "surrender_retry", "stop_after_run"];

function trigParse(when){
  const kinds = Object.keys(S.vocab.rule_triggers.fields);
  const k = kinds.find(t => t in (when || {})) || (when || {}).kind || "wave_at_least";
  if (k === "bar") { const p = { ...when }; return { k, p }; }
  if (k === "wave_at_least") return { k, p:{ wave: when.wave_at_least ?? when.wave } };
  if (k === "wave_between") { const v = when.wave_between || when.value || [];
    return { k, p:{ lo:v[0], hi:v[1] } }; }
  if (k === "death_screen") return { k, p:{} };
  return { k, p:{ ...(typeof when[k] === "object" ? when[k] : {}) } };
}
function trigBuild(k, p){
  const clean = {}; for (const [key, v] of Object.entries(p))
    if (v !== null && v !== undefined && v !== "") clean[key] = v;
  if (k === "bar") return { ...clean };
  if (k === "wave_at_least") return { wave_at_least: clean.wave };
  if (k === "wave_between") return { wave_between: [clean.lo, clean.hi] };
  if (k === "death_screen") return { death_screen: true };
  return { [k]: clean };
}
function actParse(doo){
  const kinds = Object.keys(S.vocab.rule_actions.fields);
  const k = kinds.find(a => a in (doo || {})) || "cancel_sprint";
  if (FLAG_ACTS.includes(k)) return { k, p:{} };
  return { k, p:{ ...(typeof doo[k] === "object" ? doo[k] : {}) } };
}
function actBuild(k, p){
  if (FLAG_ACTS.includes(k)) return { [k]: true };
  const clean = {}; for (const [key, v] of Object.entries(p))
    if (v !== null && v !== undefined && v !== "") clean[key] = v;
  return { [k]: clean };
}
function trigParamsHtml(i, k, p){
  if (k === "bar") { const f = S.vocab.rule_triggers.fields.bar.fields;
    return ["bar","below","falling_samples","deadband"].map(key =>
      `<span class="muted">${key}</span>${pInput(f[key], p[key],
        `p2trig(${i}, '${key}',`)}`).join(" "); }
  if (k === "wave_at_least")
    return `<span class="muted">wave</span>${pInput({ type:"int" }, p.wave, `p2trig(${i}, 'wave',`)}`;
  if (k === "wave_between")
    return `<span class="muted">from</span>${pInput({ type:"int" }, p.lo, `p2trig(${i}, 'lo',`)}
            <span class="muted">to</span>${pInput({ type:"int" }, p.hi, `p2trig(${i}, 'hi',`)}`;
  const fields = (S.vocab.rule_triggers.fields[k] || {}).fields || {};
  return Object.entries(fields).map(([key, spec]) =>
    `<span class="muted">${key}</span>${pInput(spec, p[key], `p2trig(${i}, '${key}',`)}`).join(" ");
}
function actParamsHtml(i, k, p){
  const fields = (S.vocab.rule_actions.fields[k] || {}).fields || {};
  return Object.entries(fields).map(([key, spec]) =>
    `<span class="muted">${key}</span>${pInput(spec, p[key], `p2act(${i}, '${key}',`)}`).join(" ");
}

/* draft mutators wired from the param inputs */
function p2trig(i, key, val){
  const r = P2.draft.rules[i]; const { k, p } = trigParse(r.when);
  p[key] = val; r.when = trigBuild(k, p); p2Save(false);
}
function p2act(i, key, val){
  const r = P2.draft.rules[i]; const { k, p } = actParse(r.do);
  p[key] = val; r.do = actBuild(k, p); p2Save(false);
}
function p2trigKind(i, k){
  P2.draft.rules[i].when = deep(SEEDS.triggers[k]); p2Save();
}
function p2actKind(i, k){
  // `retaps` is Tier-A-only: it is seeded only under a second_wind arm,
  // where a bar+burst rule compiles into the sub-second watch
  const seed = (k === "burst" && typeof P2.draft.arm === "object" && P2.draft.arm)
    ? SEEDS.actions.burst_tier_a : SEEDS.actions[k];
  P2.draft.rules[i].do = deep(seed); p2Save();
}
function p2rule(i, key, val){ if (val === null) delete P2.draft.rules[i][key];
  else P2.draft.rules[i][key] = val; p2Save(false); }
function p2moveRule(i, d){ const [r] = P2.draft.rules.splice(i, 1);
  P2.draft.rules.splice(i + d, 0, r); p2Save(); }
function p2delRule(i){ P2.draft.rules.splice(i, 1); p2Save(); }
function p2addRule(){ (P2.draft.rules = P2.draft.rules || []).push(
  deep(SEEDS.new_rule)); p2Save(); }
function p2arm(key, val){
  // `arm: "always"` is a bare STRING in the schema (no Tier A watch, every
  // rule at main-loop latency); only the second_wind form is a mapping.
  if (key === "mode") {
    P2.draft.arm = deep(SEEDS.arm[val === "always" ? "always" : "second_wind"]);
    if (val === 'always') {
      for (const rule of P2.draft.rules || []) {
        if (rule.do?.burst) delete rule.do.burst.retaps;
      }
      P2.draft.end_sprint_after_sw = false;
    }
  } else {
    const prev = (typeof P2.draft.arm === "object" && P2.draft.arm) || { on:"second_wind" };
    P2.draft.arm = { ...prev, [key]: val };
  }
  p2Save(key === "mode");   // mode switch shows/hides fields; the rest are numbers
}
function p2field(key, val){ P2.draft[key] = val; p2Save(); }

function p2Header(title){
  return `<header style="display:flex; justify-content:space-between; align-items:center">
    <span><b>${esc(P2.draft.label || P2.name)}</b><span class="chip kind">${title}</span>
      <span class="chip" title="the identifier other settings refer to">${esc(P2.name)}</span></span>
    <span style="display:flex; gap:.4rem">
      <button class="small ghost" onclick="p2Cancel()">Cancel</button>
      <button class="small" onclick="p2Commit()">Save ✓</button>
    </span></header>
  <div class="kv" style="margin-bottom:.7rem">
    <label>Display name <span class="muted">(how menus show it)</span></label>
    <input value="${esc(P2.draft.label || "")}" placeholder="${esc(P2.name)}"
      onchange="p2SetLabel(this.value)">
  </div>`;
}

function rescueHtml(){
  const d = P2.draft;
  const sw = typeof d.arm === "object" && d.arm !== null;   // mapping = second_wind watch
  const arm = sw ? d.arm : {};
  const trigKinds = Object.keys(S.vocab.rule_triggers.fields);
  const actKinds = Object.keys(S.vocab.rule_actions.fields)
    .filter(a => a !== "switch_cards");     // refused everywhere: not offered
  return `<article>${p2Header("rescue & rules")}
    <fieldset><legend>When may abilities fire?</legend>
      <label class="inline"><input type="radio" name="arm" ${sw ? "checked" : ""}
        onchange="p2arm('mode', 'second_wind')">
        Hold everything until after a <b>Second Wind</b> (accounts that have it)</label>
      ${sw ? `<div class="kv" style="margin-left:1.6rem; margin-bottom:.5rem">
        <label>Watch for how long after it (sec, empty = rest of the run)</label>
        <input type="number" value="${arm.watch_sec ?? ""}"
          onchange="p2arm('watch_sec', this.value === '' ? null : Number(this.value))">
        <label>Immunity backstop (sec)</label>
        <input type="number" value="${arm.immunity_sec ?? ""}"
          onchange="p2arm('immunity_sec', this.value === '' ? null : Number(this.value))">
      </div>` : ""}
      <label class="inline"><input type="radio" name="arm" ${!sw ? "checked" : ""}
        onchange="p2arm('mode', 'always')">
        Always armed — fire on the conditions alone (no Second Wind)</label>
      <label class="inline"><input type="checkbox" ${d.end_sprint_after_sw ? "checked" : ""}
        onchange="p2field('end_sprint_after_sw', this.checked)">
        End the intro sprint the moment a Second Wind window closes</label>
    </fieldset>
    <fieldset><legend>If this… then that (top rule wins first)</legend>
      ${(d.rules || []).map((r, i) => {
        const t = trigParse(r.when); const a = actParse(r.do);
        return `<div class="rulecard">
          <div class="rowline"><b>WHEN</b>
            <select onchange="p2trigKind(${i}, this.value)">
              ${trigKinds.map(k => `<option value="${k}" ${t.k === k ? "selected" : ""}>
                ${esc(TRIG_LABEL[k] || k)}</option>`).join("")}
            </select>${trigParamsHtml(i, t.k, t.p)}</div>
          <div class="rowline"><b>THEN</b>
            <select onchange="p2actKind(${i}, this.value)">
              ${actKinds.map(k => `<option value="${k}" ${a.k === k ? "selected" : ""}>
                ${esc(ACT_LABEL[k] || k)}</option>`).join("")}
            </select>${actParamsHtml(i, a.k, a.p)}</div>
          <div class="rowline"><b></b>
            <label class="inline" style="margin:0">
              <input type="checkbox" ${r.repeat ? "checked" : ""}
                onchange="p2rule(${i}, 'repeat', this.checked || null)"> may repeat</label>
            <span class="muted">cooldown s</span>
            <input type="number" step="any" value="${r.refire_sec ?? ""}"
              onchange="p2rule(${i}, 'refire_sec', this.value === '' ? null : Number(this.value))">
            <span style="margin-left:auto">
              ${i > 0 ? `<button class="small ghost" onclick="p2moveRule(${i},-1)">↑</button>` : ""}
              ${i < d.rules.length - 1 ? `<button class="small ghost" onclick="p2moveRule(${i},1)">↓</button>` : ""}
              <button class="small danger" onclick="p2delRule(${i})">✕</button></span></div>
        </div>`; }).join("")}
      <button class="small ghost" onclick="p2addRule()">＋ add a rule</button>
    </fieldset>
    <p class="muted">A tournament run can never be surrendered by a rule, a
      wall rule is refused on an account with no wall, and an ability your
      account doesn't own can't be armed — the validator enforces all of it
      and explains any refusal.</p></article>`;
}

function shopHtml(){
  const d = P2.draft;
  const tabs = S.vocab.shop_tabs.values, modes = S.vocab.shop_modes.values;
  const stats = S.vocab.shop_stats.values;
  return `<article>${p2Header("shopping priorities")}
    <label class="inline"><input type="checkbox" ${d.enabled !== false ? "checked" : ""}
      onchange="p2field('enabled', this.checked)">
      Workshop shopping on <span class="muted">(off = the panel is never opened)</span></label>
    <fieldset><legend>Buy in this order (top first, every sweep)</legend>
    ${(d.directives || []).map((dir, i) => `
      <div class="rulecard">
        <div class="rowline">
          <input type="checkbox" ${dir.enabled !== false ? "checked" : ""}
            onchange="p2dir(${i}, 'enabled', this.checked)">
          <select onchange="p2dir(${i}, 'tab', this.value)">
            ${tabs.map(t => `<option ${dir.tab === t ? "selected" : ""}>${esc(t)}</option>`).join("")}
          </select>
          <select onchange="p2dir(${i}, 'mode', this.value)">
            ${modes.map(m => `<option ${dir.mode === m ? "selected" : ""}>${esc(m)}</option>`).join("")}
          </select>
          ${dir.mode === "clicks" ? `<input type="number" min="1" value="${dir.clicks ?? 3}"
            onchange="p2dir(${i}, 'clicks', Number(this.value))">` : ""}
          <span style="margin-left:auto">
            ${i > 0 ? `<button class="small ghost" onclick="p2moveDir(${i},-1)">↑</button>` : ""}
            ${i < d.directives.length - 1 ? `<button class="small ghost" onclick="p2moveDir(${i},1)">↓</button>` : ""}
            <button class="small danger" onclick="p2delDir(${i})">✕</button></span></div>
        <div class="statchips">${stats.map(s => `
          <span class="chip ${(dir.stats || []).includes(s) ? "on" : ""}"
            onclick="p2statToggle(${i}, '${s}')">${esc(s.replace(/_/g, " "))}</span>`).join("")}
        </div>
      </div>`).join("")}
    <button class="small ghost" onclick="p2addDir()">＋ add a line</button>
    </fieldset>
    <p class="muted">“repeat” buys whenever affordable, “once” buys one per
      run, “best_cost” takes the cheapest first, “clicks” taps a fixed number
      of times. Unticked lines stay in the list but are skipped.</p></article>`;
}
function p2dir(i, key, val){ P2.draft.directives[i][key] = val;
  p2Save(key !== "clicks"); }   // clicks is a number input; mode/tab restructure
function p2statToggle(i, s){
  const d = P2.draft.directives[i]; d.stats = d.stats || [];
  d.stats = d.stats.includes(s) ? d.stats.filter(x => x !== s) : [...d.stats, s];
  p2Save();
}
function p2moveDir(i, d){ const [x] = P2.draft.directives.splice(i, 1);
  P2.draft.directives.splice(i + d, 0, x); p2Save(); }
function p2delDir(i){ P2.draft.directives.splice(i, 1); p2Save(); }
function p2addDir(){ (P2.draft.directives = P2.draft.directives || []).push(
  deep(SEEDS.new_directive)); p2Save(); }

function uwHtml(){
  const d = P2.draft; const cl = d.chain_lightning || {};
  // ALL ultimate weapons are listed (user ruling 2026-08-29): a preset may
  // name any UW - ownership (player.uws) only decides what applies on this
  // account, so unowned ones stay authorable and are marked as skipped.
  const inv = ((S.profile.player || {}).uws) || {};
  const all = (((S.vocab.uw_names || {}).values) || Object.keys(inv))
    .filter(w => w !== "chain_lightning");
  const ownedSet = new Set(Object.entries(inv)
    .filter(([, own]) => own).map(([w]) => w));
  const modes = S.vocab.cl_modes.values;
  const pair = (label, key, show) => show ? `
    <label>${label}</label>
    <span style="display:flex; gap:.4rem">
      <input type="number" style="width:6rem" value="${(cl[key] || [])[0] ?? ""}"
        onchange="p2clPair('${key}', 0, this.value)">
      <input type="number" style="width:6rem" value="${(cl[key] || [])[1] ?? ""}"
        onchange="p2clPair('${key}', 1, this.value)">
    </span>` : "";
  return `<article>${p2Header("weapon plan")}
    <fieldset><legend>Baseline — forced ON at the start of every run</legend>
      ${all.length ? all.map(w => `
        <label class="inline"><input type="checkbox"
          ${(d.baseline || {})[w] ? "checked" : ""}
          onchange="p2baseline('${w}', this.checked)">
          ${esc(w.replace(/_/g, " "))}${ownedSet.has(w) ? ""
            : ' <span class="muted">(not owned — skipped here)</span>'}</label>`).join("")
        : '<p class="muted">No ultimate weapons in the vocabulary.</p>'}
    </fieldset>
    <fieldset><legend>Chain Lightning choreography</legend>
      <div class="kv">
        <label>Mode</label>
        <select onchange="p2clMode(this.value)">
          ${modes.map(m => `<option ${cl.mode === m ? "selected" : ""}>${esc(m)}</option>`).join("")}
        </select>
        ${pair("Latch ON for good between waves", "always_on_above", cl.mode === "fleet_marks")}
        ${pair("Turn ON above wave (range)", "on_above", cl.mode === "off_until_wave")}
        ${pair("ON this many waves before a fleet", "pre_mark_waves", cl.mode === "fleet_marks")}
        ${pair("OFF this many waves after one", "off_after_waves", cl.mode === "fleet_marks")}
      </div>
      <p class="muted">fleet_marks = on around each fleet spawn, then latched
        on late-run; off_until_wave = dark until the range, then on for good.
        Ranges are randomized per run so no two runs toggle on the same wave.</p>
    </fieldset></article>`;
}
function p2baseline(w, on){ P2.draft.baseline = { ...(P2.draft.baseline || {}) };
  P2.draft.baseline[w] = on; p2Save(); }
function p2cl(key, val){ P2.draft.chain_lightning = { ...(P2.draft.chain_lightning || {}) };
  P2.draft.chain_lightning[key] = val; p2Save(); }
function p2clMode(v){
  // a mode is only valid WITH its required ranges - seed whatever the new
  // mode needs and is not already set (fleet_marks: pre/off windows;
  // off_until_wave: the on_above range)
  const cl = { ...(P2.draft.chain_lightning || {}), mode: v };
  for (const [k, val] of Object.entries(SEEDS.cl_modes[v] || {}))
    if (cl[k] == null) cl[k] = deep(val);
  P2.draft.chain_lightning = cl; p2Save();
}
function p2clPair(key, idx, val){
  const cl = P2.draft.chain_lightning = { ...(P2.draft.chain_lightning || {}) };
  const arr = [...(cl[key] || [null, null])];
  arr[idx] = val === "" ? null : Number(val);
  cl[key] = arr; p2Save(false);
}

/* ------------------------------------------------------------------ boot */
(async function boot(){
  // the save bar hides while a modal editor is open (it would be inert
  // behind the backdrop); `close` fires for Save, Cancel and Esc alike.
  for (const d of document.querySelectorAll("dialog"))
    d.addEventListener("close", syncSaveBar);
  await loadStatus();
  setInterval(loadStatus, 2500);
  route();
})();
</script>
</body>
