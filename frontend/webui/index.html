<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Pilot</title>
<link rel="stylesheet" href="vendor/pico.min.css">
<link rel="icon" href="data:,">
<style>
  /* ------------------------------------------------ iOS liquid-glass skin */
  :root {
    --pico-font-size: 15px;
    --pico-font-family: -apple-system, "SF Pro Display", "SF Pro Text",
                        BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI",
                        system-ui, sans-serif;
    --ios-blue: #0a84ff;
    --glass:        rgba(255,255,255,.07);
    --glass-strong: rgba(255,255,255,.11);
    --glass-border: rgba(255,255,255,.14);
    --glass-inner:  rgba(255,255,255,.05);
    --pico-border-radius: 14px;
  }
  html { background:#0b0f1d; }
  body {
    padding:0; min-height:100vh; color:#eef1f7;
    background:
      radial-gradient(1100px 700px at 12% -8%,  rgba(88,101,242,.32), transparent 60%),
      radial-gradient(900px 650px  at 95% 12%,  rgba(10,132,255,.22), transparent 55%),
      radial-gradient(1000px 800px at 55% 115%, rgba(191,90,242,.18), transparent 60%),
      linear-gradient(180deg, #0d1226 0%, #0a0e1c 100%);
    background-attachment: fixed;
  }
  ::selection { background:rgba(10,132,255,.4); }
  #screen-mapping { max-height:10rem; overflow-y:auto; }

  header.topbar {
    display:flex; align-items:center; gap:1.2rem; padding:.6rem 1.3rem;
    position:sticky; top:0; z-index:20;
    background:rgba(16,20,38,.55);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    backdrop-filter: blur(24px) saturate(1.6);
    border-bottom:1px solid var(--glass-border);
  }
  .brand { font-weight:700; font-size:1.05rem; white-space:nowrap; letter-spacing:.01em; }
  .brand small { opacity:.55; font-weight:400; }
  nav.steps { display:flex; gap:.45rem; }
  nav.steps.right { margin-left:auto; }
  .connect-overlay {
    position:fixed; inset:0; z-index:40;
    display:flex; align-items:center; justify-content:center;
    background:rgba(8, 11, 22, .55);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
    backdrop-filter: blur(16px) saturate(1.3);
  }
  .connect-overlay article { text-align:center; max-width:26rem; padding:1.6rem 2rem; }
  #savebar {
    position:fixed; bottom:1.1rem; left:50%; transform:translateX(-50%);
    z-index:45; display:flex; gap:.6rem; align-items:center;
    padding:.55rem 1.1rem; border-radius:999px;
    background:rgba(22, 28, 52, .78);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    backdrop-filter: blur(20px) saturate(1.5);
    border:1px solid var(--glass-border);
    box-shadow:0 10px 34px rgba(0,0,0,.45);
  }
  #savebar span { font-size:.88rem; opacity:.85; }
  nav.steps a {
    padding:.34rem .95rem; border-radius:999px; text-decoration:none;
    color:#eef1f7; opacity:.72; font-size:.9rem; white-space:nowrap;
    border:1px solid transparent; transition:all .18s ease;
  }
  nav.steps a:hover { background:var(--glass); opacity:1; }
  nav.steps a.active {
    background:linear-gradient(180deg, rgba(10,132,255,.85), rgba(10,110,240,.75));
    box-shadow:0 4px 18px rgba(10,132,255,.35), inset 0 1px 0 rgba(255,255,255,.25);
    opacity:1; color:#fff;
  }
  nav.steps a.locked { opacity:.28; pointer-events:none; }
  nav.steps a .n {
    display:inline-block; width:1.35rem; height:1.35rem; line-height:1.32rem;
    text-align:center; border-radius:50%; background:rgba(255,255,255,.14);
    font-size:.74rem; margin-right:.4rem;
  }
  nav.steps a.active .n { background:rgba(255,255,255,.25); color:#fff; }

  main { padding:1.1rem 1.3rem 4rem; max-width:1500px; margin:0 auto; }
  .grid2 { display:grid; grid-template-columns:1fr 360px; gap:1.1rem; align-items:start; }
  @media (max-width:1100px){ .grid2 { grid-template-columns:1fr; } }

  article {
    padding:1.05rem 1.2rem; margin:0 0 1.1rem;
    background:var(--glass);
    -webkit-backdrop-filter: blur(28px) saturate(1.5);
    backdrop-filter: blur(28px) saturate(1.5);
    border:1px solid var(--glass-border); border-radius:20px;
    box-shadow:0 10px 34px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.10);
  }
  article > header {
    margin:-1.05rem -1.2rem .9rem; padding:.6rem 1.2rem; font-weight:650;
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border-bottom:1px solid rgba(255,255,255,.08);
    border-radius:20px 20px 0 0; letter-spacing:.01em;
  }
  .step-num {
    display:inline-block; width:1.65rem; height:1.65rem; line-height:1.65rem;
    text-align:center; border-radius:50%; margin-right:.55rem; font-size:.85rem;
    background:linear-gradient(180deg, #3ea0ff, #0a6ef0); color:#fff;
    box-shadow:0 3px 10px rgba(10,132,255,.4), inset 0 1px 0 rgba(255,255,255,.35);
  }

  .ok  { color:#30d158; } .bad { color:#ff453a; } .warn { color:#ffd60a; }
  .dot { display:inline-block; width:.6rem; height:.6rem; border-radius:50%; margin-right:.4rem;
         box-shadow:0 0 8px currentColor; }
  .dot.ok { background:#30d158; color:#30d158; }
  .dot.bad { background:#ff453a; color:#ff453a; }
  .dot.unknown { background:#98989d; color:transparent; }

  table { font-size:.86rem; --pico-background-color:transparent; }
  th { opacity:.55; font-weight:600; border-bottom-color:rgba(255,255,255,.12); }
  td { border-bottom:1px solid rgba(255,255,255,.06); }
  td, th { padding:.4rem .55rem; background:transparent; }

  button, [role=button], input[type=submit] {
    font-size:.86rem; padding:.4rem 1rem; border-radius:999px;
    background:linear-gradient(180deg, rgba(10,132,255,.9), rgba(9,105,235,.85));
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 4px 14px rgba(10,132,255,.3), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .12s ease, filter .12s ease; font-weight:560;
  }
  button:hover, [role=button]:hover { filter:brightness(1.12); }
  button:active { transform:scale(.97); }
  button.small { padding:.18rem .7rem; font-size:.78rem; }
  button.ghost, a[role=button].ghost {
    background:var(--glass-strong); color:#eef1f7;
    border:1px solid var(--glass-border); box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
  }
  button.danger {
    background:linear-gradient(180deg, rgba(255,69,58,.85), rgba(215,40,30,.85));
    border-color:rgba(255,255,255,.15); box-shadow:0 4px 14px rgba(255,69,58,.25);
  }

  input, select, textarea {
    --pico-background-color: rgba(255,255,255,.08);
    --pico-border-color: var(--glass-border);
    --pico-color:#eef1f7;
    border-radius:12px;
  }
  input:focus, select:focus {
    --pico-border-color: var(--ios-blue);
    box-shadow:0 0 0 3px rgba(10,132,255,.25);
  }

  /* iOS switches for every checkbox */
  input[type=checkbox]:not([role=none]) {
    appearance:none; -webkit-appearance:none; cursor:pointer;
    width:2.55rem; height:1.5rem; border-radius:999px; margin:0;
    background:rgba(120,120,128,.36); border:none; position:relative;
    transition:background .2s ease; flex:none; vertical-align:middle;
  }
  input[type=checkbox]:not([role=none])::after {
    content:""; position:absolute; top:.14rem; left:.14rem;
    width:1.22rem; height:1.22rem; border-radius:50%; background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.35); transition:left .2s ease;
  }
  input[type=checkbox]:not([role=none]):checked { background:#30d158; }
  input[type=checkbox]:not([role=none]):checked::after { left:1.19rem; }
  input[type=checkbox]:disabled { opacity:.4; cursor:default; }
  input[type=radio] { accent-color: var(--ios-blue); }

  .muted { opacity:.6; font-size:.83rem; }
  .stream-box img { width:100%; border-radius:16px; border:1px solid var(--glass-border);
                    box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .events {
    font-family:"SF Mono", ui-monospace, Consolas, monospace; font-size:.74rem;
    max-height:14rem; overflow-y:auto; border-radius:12px; padding:.55rem .75rem;
    background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.08);
  }
  .events div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .chip { display:inline-block; padding:.08rem .6rem; border-radius:999px; font-size:.72rem;
          background:var(--glass-strong); border:1px solid var(--glass-border);
          margin-left:.4rem; vertical-align:middle; }
  .chip.kind { background:rgba(10,132,255,.25); border-color:rgba(10,132,255,.4); }
  .chip.ok { background:rgba(48,209,88,.2); border-color:rgba(48,209,88,.45); }

  .flowcard {
    display:flex; align-items:center; justify-content:space-between; gap:.6rem;
    padding:.55rem .8rem; border:1px solid var(--glass-border); border-radius:14px;
    margin-bottom:.5rem; background:var(--glass-inner);
  }
  .flowcard b { font-size:.9rem; }
  /* an image a run still needs: red-flagged so it is identifiable at a glance */
  .flowcard.outstanding { border-color:rgba(255,69,58,.55); background:rgba(255,69,58,.07); align-items:flex-start; }
  .flowcard.outstanding.focus { box-shadow:0 0 0 2px #ff453a; }
  .flowcard .artwork { width:56px; height:56px; object-fit:contain; flex:none; background:rgba(255,255,255,.07); border-radius:8px; }
  /* Art / Screenshot pair: the installed game's artwork next to what was cut
     from this screen, on a green (identified) or red (failing) ground */
  .artpair { display:inline-flex; gap:.3rem; align-items:center; padding:.2rem; border-radius:8px; vertical-align:middle; margin-right:.4rem; }
  .artpair.ok { background:rgba(48,209,88,.28); } .artpair.bad { background:rgba(255,69,58,.28); }
  .artpair .artwork { width:44px; height:44px; }
  .artpair .artwork.shot { outline:1px solid rgba(255,255,255,.25); }
  tr.row-ok td { background:rgba(48,209,88,.10); } tr.row-bad td { background:rgba(255,69,58,.10); }

  .blockrow { display:grid; grid-template-columns:1.4fr 5.2rem 5.2rem 4.2rem auto;
              gap:.4rem; align-items:center; margin-bottom:.4rem; }
  .blockrow input, .blockrow select { margin:0; padding:.25rem .55rem; font-size:.82rem; height:2.15rem; }

  dialog { background:rgba(8,10,20,.5); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  dialog article {
    max-width:660px; width:92vw; max-height:88vh; overflow-y:auto;
    background:rgba(22,26,46,.82);
    -webkit-backdrop-filter:blur(40px) saturate(1.6);
    backdrop-filter:blur(40px) saturate(1.6);
    border-radius:24px;
  }
  fieldset { border:1px solid rgba(255,255,255,.10); border-radius:16px;
             padding:.75rem 1rem; margin-bottom:.95rem; background:rgba(255,255,255,.03); }
  legend { padding:0 .45rem; font-size:.82rem; font-weight:650; opacity:.85; }
  label.inline { display:flex; align-items:center; gap:.6rem; font-size:.86rem; margin-bottom:.45rem; }
  .kv { display:grid; grid-template-columns:11.5rem 1fr; gap:.45rem .8rem; align-items:center; }
  .kv label { margin:0; font-size:.85rem; }
  .kv input, .kv select { margin:0; padding:.3rem .65rem; font-size:.85rem; height:2.25rem; }

  #toasts { position:fixed; bottom:1.1rem; right:1.1rem; z-index:99; display:flex;
            flex-direction:column; gap:.5rem; max-width:26rem; }
  .toast {
    padding:.65rem 1rem; border-radius:14px; font-size:.85rem; color:#fff;
    background:rgba(35,45,40,.7); border:1px solid rgba(48,209,88,.45);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  .toast.err { background:rgba(60,25,25,.75); border-color:rgba(255,69,58,.5); white-space:pre-wrap; }

  .tpl-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px,1fr)); gap:.5rem; }
  .tpl-grid figure { margin:0; text-align:center; }
  .tpl-grid img { max-width:100%; max-height:70px; background:rgba(255,255,255,.08);
                  border-radius:8px; }
  .tpl-grid figcaption { font-size:.65rem; word-break:break-all; opacity:.7; }
  details summary { font-size:.9rem; }
  details { background:transparent; }

  .withpen { display:flex; gap:.4rem; align-items:center; }
  .withpen select { flex:1; }
  .rulecard { border:1px solid var(--glass-border); border-radius:14px;
              padding:.6rem .8rem; margin-bottom:.6rem; background:var(--glass-inner); }
  .rulecard .rowline { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-bottom:.4rem; }
  .rulecard .rowline > b { width:3.4rem; font-size:.78rem; opacity:.65; text-align:right; }
  .rulecard select, .rulecard input[type=number], .rulecard input[type=text] {
    margin:0; padding:.25rem .55rem; font-size:.82rem; height:2.15rem; width:auto; }
  .rulecard input[type=number] { width:5.5rem; }
  .statchips { display:flex; flex-wrap:wrap; gap:.35rem; }
  .statchips .chip { cursor:pointer; margin:0; user-select:none; padding:.2rem .7rem; }
  .statchips .chip.on { background:rgba(10,132,255,.35); border-color:rgba(10,132,255,.6); }
  .daytabs { display:flex; gap:.45rem; flex-wrap:wrap; margin-bottom:.75rem; }
  .weekmap { display:grid; grid-template-columns:repeat(4,1fr); gap:.4rem .8rem; font-size:.8rem; }
  .weekmap select { margin:0; padding:.2rem .5rem; height:2rem; font-size:.8rem; }

  .scan-progress { margin:1rem 0; padding:1rem; border:1px solid var(--glass-border); border-radius:14px; background:rgba(10,132,255,.045); min-width:0; }
  .scan-progress-heading { display:flex; justify-content:space-between; flex-wrap:wrap; gap:.5rem; }
  .scan-progress progress { width:100%; height:.6rem; margin:.6rem 0; accent-color:var(--ios-blue); }
  .scan-action { margin:.2rem 0 .5rem; font-weight:600; overflow-wrap:anywhere; }
  .scan-stops { display:flex; overflow-x:auto; padding:.5rem 0 1rem; margin:0; list-style:none; gap:0; }
  .scan-stops li { list-style:none; flex:0 0 9.2rem; position:relative; padding:.25rem .65rem; text-align:center; font-size:.85rem; }
  .scan-stops li:not(:last-child)::after { content:""; position:absolute; top:1.15rem; left:calc(50% + 1rem); width:calc(100% - 2rem); height:2px; background:var(--glass-border); }
  .scan-dot { display:block; margin:0 auto .5rem; width:1.9rem; height:1.9rem; line-height:1.7rem; border:2px solid var(--glass-border); border-radius:50%; background:#151b30; }
  .scan-stops small { display:block; margin-top:.3rem; }
  .scan-step-done .scan-dot { border-color:#30d158; color:#30d158; }
  .scan-step-running .scan-dot { border-color:#64b5ff; color:#64b5ff; box-shadow:0 0 0 4px rgba(10,132,255,.18); }
  .scan-step-running { color:#b4dcff; }
  .scan-step-error .scan-dot { border-color:#ff6961; color:#ff6961; }
  .scan-step-skipped .scan-dot, .scan-step-needs_attention .scan-dot, .scan-step-stopped .scan-dot { border-color:#ffcc66; color:#ffcc66; }
  .scan-history { max-height:13rem; overflow:auto; margin:.4rem 0 0; padding-left:1.2rem; font-size:.85rem; }
  .scan-history li { margin:.4rem 0; overflow-wrap:anywhere; }
  .scan-history time { color:var(--pico-muted-color); margin-right:.6rem; font-variant-numeric:tabular-nums; }
  /* Vertical at every viewport: extraction has many named steps. */
    .scan-stops { display:block; max-height:20rem; overflow:auto; }
    .scan-stops li { text-align:left; padding:.4rem 0 .4rem 2.7rem; min-height:3.6rem; }
    .scan-dot { position:absolute; left:0; top:.4rem; }
    .scan-stops li:not(:last-child)::after { left:.9rem; top:2.35rem; width:2px; height:calc(100% - 1.9rem); }
</style>

<script>
"use strict";
/* Tower Pilot UI - three stages: Setup -> Calibrate -> Control.
   Talks only to the dashboard's existing JSON API; every profile edit goes
   through /api/profile-patch, where the COMPILER's validator has the last
   word - its message is shown verbatim, never rephrased. */

const $ = s => document.querySelector(s);
const S = { status:null, vocab:null, flows:null, config:null,
            profiles:null, profile:null, wizard:null, calib:null,
            emus:null, view:null, day:null, scanPoll:null,
            pending:new Map(), serverProfile:null, editorBp:null };
const SEEDS = JSON.parse(document.getElementById("ui-seeds").textContent);

function esc(s){ return String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toast(msg, err=false){
  // one toast per message: a refusal repeated by every retry stacks the same
  // verdict four times high and hides the page behind it
  for (const old of $("#toasts").children)
    if (old.textContent === msg) { old.remove(); break; }
  const d = document.createElement("div");
  d.className = "toast" + (err ? " err" : "");
  d.textContent = msg;
  $("#toasts").appendChild(d);
  setTimeout(() => d.remove(), err ? 9000 : 3500);
}

async function api(path, opts){
  const r = await fetch(path, opts);
  let j = null; try { j = await r.json(); } catch(e){}
  if (!r.ok || (j && j.ok === false)) {
    const m = j && (j.error || (j.problems || []).join("\n")) || `HTTP ${r.status}`;
    throw new Error(m);
  }
  return j;
}
const post = (p, b) => api(p, { method:"POST",
  headers:{ "Content-Type":"application/json" }, body: JSON.stringify(b || {}) });

/* ---- profile patching: one field, one request, validator verdict verbatim */
async function patch(path, value, op){
  const body = { name:S.profiles.active, path, value };
  if (op) body.op = op;
  try {
    const r = await post("/api/profile-patch", body);
    S.serverProfile = JSON.parse(JSON.stringify(r.profile));
    S.profile = r.profile;
    // staged-but-unsaved edits stay visible on top of the fresh server truth
    for (const [, e] of (S.pending || new Map()))
      try { applyLocal(S.profile, e.path, e.value, e.op); } catch(_){ /* stale path */ }
    (r.warnings || []).forEach(w => toast("note: " + w));
    return true;
  } catch(e){ toast(e.message, true); return false; }
}

/* ---- staged edits: NOTHING is written on change. Every edit queues here
   (mirrored into S.profile so the UI shows it) and is committed only by an
   explicit Save - the dialog buttons or the sticky bar. Validation happens
   at Save, against whole objects, so a half-finished edit never errors. */
const deep = v => v === undefined ? v : JSON.parse(JSON.stringify(v));
function applyLocal(root, path, value, op){
  let node = root;
  for (let i = 0; i < path.length - 1; i++) {
    const step = path[i];
    if (node[step] == null)
      node[step] = (typeof path[i + 1] === "number") ? [] : {};
    node = node[step];
  }
  const leaf = path[path.length - 1];
  if (op === "delete") {
    if (Array.isArray(node)) node.splice(leaf, 1); else delete node[leaf];
  } else if (Array.isArray(node) && leaf === node.length) node.push(value);
  else node[leaf] = value;
}
function queuePatch(path, value, op){
  S.pending.set(JSON.stringify(path), { path:deep(path), value:deep(value), op });
  applyLocal(S.profile, path, deep(value), op);
  syncSaveBar();
}
function restoreSubtree(path){
  let src = S.serverProfile, dst = S.profile;
  for (const step of path.slice(0, -1)) {
    src = src ? src[step] : undefined;
    dst = dst ? dst[step] : undefined;
  }
  if (!dst) return;
  const leaf = path[path.length - 1];
  if (src && src[leaf] !== undefined) dst[leaf] = deep(src[leaf]);
  else if (Array.isArray(dst)) { if (leaf in dst) dst.splice(leaf, 1); }
  else delete dst[leaf];
}
function dropPending(prefixes){
  for (const [key, e] of [...S.pending])
    if (prefixes.some(p => p.every((s, i) => e.path[i] === s)))
      S.pending.delete(key);
  for (const p of prefixes) restoreSubtree(p);
  syncSaveBar();
}
async function saveAll(){
  for (const [key, e] of [...S.pending.entries()]) {
    if (!(await patch(e.path, e.value, e.op))) { rerenderEdits(); return false; }
    S.pending.delete(key);
  }
  syncSaveBar(); rerenderEdits();
  toast("saved ✓");
  return true;
}
function discardAll(){
  S.pending.clear();
  if (S.serverProfile) S.profile = deep(S.serverProfile);
  syncSaveBar(); rerenderEdits();
}
function syncSaveBar(){
  const bar = $("#savebar");
  if (!bar) return;
  const n = S.pending.size;
  // A modal dialog makes everything outside it inert - the bar would show
  // but be unclickable. Each editor carries its own Save ✓ (which commits
  // staged edits too), so the bar yields while one is open and returns on
  // close (the dialogs' close listeners re-run this).
  bar.hidden = n === 0 || !!document.querySelector("dialog[open]");
  $("#savebar-n").textContent = n === 1 ? "1 unsaved change" : `${n} unsaved changes`;
}
function rerenderEdits(){
  if (S.view === "home" && S.profile) {
    renderDay(); renderFlows(); renderBehaviors(); renderGlobal();
  }
  const ed = $("#editor");
  if (ed && ed.open && S.editorBp) ed.innerHTML = editorHtml(S.editorBp);
  const ed2 = $("#editor2");
  if (ed2 && ed2.open && P2.kind) p2Render();
}

/* ------------------------------------------------------------- data loads */
async function loadStatus(){
  try { S.status = await api("/api/status"); } catch(e){ S.status = null; }
  applyGate();
  renderBootStatus();
  const el = $("#brand-inst");
  if (el && S.status) el.textContent = "· " + S.status.instance;
  if (S.view === "home") renderHomeLive();
}

async function loadHomeData(){
  const [vocab, flows, config, plist, templates] = await Promise.all([
    api("/api/vocab"), api("/api/flows"), api("/api/config"),
    api("/api/profiles"), api("/api/run-templates")]);
  S.runTemplates = templates.templates;
  S.vocab = vocab.vocab; S.flows = flows.flows; S.config = config;
  const rows = Array.isArray(plist) ? plist : (plist.profiles || []);
  S.profiles = {
    list: rows.map(r => ({ name:String(r.name || r).replace(/\.yaml$/, ""),
                           draft:!!r.draft })),
    active: config.active_profile || null,
  };
  S.profile = null;
  if (S.profiles.active) {
    try { S.profile = await api("/api/profile/" +
            encodeURIComponent(S.profiles.active) + ".yaml"); }
    catch(e){ toast("active profile unreadable: " + e.message, true); }
  }
  if (S.profile) {
    S.serverProfile = deep(S.profile);
    // navigating away and back must not lose staged, unsaved edits
    for (const [, e] of S.pending)
      try { applyLocal(S.profile, e.path, e.value, e.op); } catch(_){ /* stale */ }
    syncSaveBar();
  }
}

/* ------------------------------------------------------------------ gate */
function calibOk(){
  return S.status?.calibration?.ready === true;
}
function applyGate(){
  if (!S.status) return;   // never RE-lock on a transient status failure
  const done = !!S.status.setup_complete;
  $("#nav-calibrate").classList.toggle("locked", !done);
  $("#nav-home").classList.toggle("locked", !done || !calibOk());
  $("#nav-home").setAttribute("aria-disabled", String(!done || !calibOk()));
  $("#nav-home").title = calibOk() ? "Control" : "Complete the scan and capture navigation images first";
  if (S.view === "home" && (!done || !calibOk())) route();
  syncConnectOverlay();
}
/* Setup, then recognition scan, then Control. Direct hashes use the same gate. */
function defaultView(){
  if (!(S.status && S.status.setup_complete)) return "setup";

  return calibOk() ? "home" : "calibrate";
}

/* ---------------------------------------------------------------- router */
window.addEventListener("hashchange", route);
async function route(){
  for (const id of ["editor", "editor2", "editor3"]) {
    const dlg = $("#" + id);
    if (dlg && dlg.open) dlg.close();   // staged edits persist in the save bar
  }
  const done = !!(S.status && S.status.setup_complete);
  let v = (location.hash || "").replace("#","") || defaultView();
  if (!done && v !== "setup") v = "setup";
  else if (v === "home" && !calibOk()) v = "calibrate";

  // keep the hash honest after a bounce, or the next click on the same nav
  // item fires no hashchange and the page looks dead
  if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
  S.view = v;
  for (const n of ["setup","calibrate","home"])
    $("#nav-" + n).classList.toggle("active", n === v);
  $("#view").innerHTML = `<article aria-busy="true">Loading…</article>`;
  try {
    if (v === "setup")      await renderSetup();
    if (v === "calibrate")  await renderCalibrate();
    if (v === "home")       await renderHome();
  } catch(e){
    $("#view").innerHTML = `<article><b class="bad">This page failed to load.</b>
      <p class="muted">${esc(e.message)}</p>
      <button onclick="route()">Try again</button></article>`;
  }
  syncConnectOverlay();
}

/* ------------------------------------------------- connect overlay (home) */
function syncConnectOverlay(){
  const want = S.view === "home" && S.status && !S.status.connected;
  let ov = $("#connect-overlay");
  if (!want) { if (ov) ov.remove(); return; }
  const cfg = S.config || {};
  const inst = (cfg.instances || {})[cfg.active_instance] || {};
  if (cfg.instances && !inst.serial) { location.hash = "#setup"; return; }
  const label = esc(inst.label || cfg.active_instance || "the emulator");
  const serial = esc(inst.serial || "");
  if (!ov) {
    ov = document.createElement("div");
    ov.id = "connect-overlay"; ov.className = "connect-overlay";
    document.body.appendChild(ov);
  }
  if (ov.dataset.serial !== serial) {
    ov.dataset.serial = serial;
    ov.innerHTML = `<article>
      <h3 style="margin-top:0">Not connected</h3>
      <p class="muted">${label}${serial ? ` (${serial})` : ""} is not
        answering. Start it right here, or connect if it is already up.</p>
      <button onclick="reconnect(this)">🔌 Connect</button>
      <div id="ov-emus" class="muted" style="margin-top:.9rem; font-size:.88rem">
        scanning emulators…</div>
    </article>`;
    ovLoadEmulators();
  }
}
/* The overlay's emulator list: every instance the managers know about,
   with a Start button for stopped MuMu VMs - starting from the web was
   only possible on the Setup page before (user, 2026-08-28). Fetched once
   per overlay appearance (the managers' inventory calls are not free),
   re-scan is manual. */
async function ovLoadEmulators(){
  const box = $("#ov-emus");
  if (!box) return;
  try {
    const e = await api("/api/wizard/emulators");
    const rows = (e.instances || []).filter(i => !i.error).map(i => {
      const addr = i.adb_port ? `127.0.0.1:${i.adb_port}` : "";
      const fam = (i.emulator || "");
      const canStart = !i.running && i.index !== undefined
        && (fam.startsWith("MuMu") || fam.startsWith("BlueStacks"));
      return `<tr>
        <td style="text-align:left">${esc(i.emulator || "?")} ${esc(i.name || "")}</td>
        <td>${i.running ? '<span class="ok">running</span>'
                        : '<span class="muted">off</span>'}</td>
        <td class="muted">${esc(addr)}</td>
        <td>${canStart ? `<button class="small"
              onclick="ovStartVM(this, '${esc(fam)}', '${esc(String(i.index))}')">▶ Start</button>` : ""}</td>
      </tr>`;
    });
    box.innerHTML = rows.length
      ? `<table style="margin:.2rem 0"><tbody>${rows.join("")}</tbody></table>
         <button class="small ghost" onclick="ovLoadEmulators()">↻ re-scan</button>`
      : "no emulator instances detected on this computer";
  } catch(err){
    box.textContent = "emulator scan failed: " + err.message;
  }
}
async function ovStartVM(btn, emulator, index){
  btn.disabled = true; btn.textContent = "starting…";
  try {
    const r = await post("/api/wizard/launch", { emulator, index });
    toast(r.message || "launch requested");
    // MuMu boots for ~a minute; the boot pipeline then clears ads and
    // starts the game, and the overlay clears itself once the adb port
    // answers the status probe. The button stays "starting…" meanwhile.
  } catch(e){
    toast(e.message, true);
    btn.disabled = false; btn.textContent = "▶ Start";
  }
}
async function reconnect(btn){
  if (btn) { btn.disabled = true; btn.textContent = "connecting…"; }
  try {
    const r = await post("/api/wizard/reconnect", {});
    toast(r.message || "connected");
  } catch(e){ toast(e.message, true); }
  await loadStatus();   // fresh `connected` -> the overlay clears itself
  if (btn && $("#connect-overlay")) { btn.disabled = false; btn.textContent = "🔌 Connect"; }
}

/* ========================================================== VIEW 1: SETUP */

async function selectAccount(create=false){

async function renderSetup(){
  S.tools = await api("/api/wizard/tools").catch(e => ({stage:"error",message:e.message}));
  S.accounts = await api("/api/accounts").catch(() => ({accounts:[]}));
  [S.wizard, S.emus] = await Promise.all([
    api("/api/wizard/state").catch(() => ({})),
    api("/api/wizard/emulators").catch(e => ({ error:e.message }))]);
  const e = S.emus || {};
  const res = (S.wizard || {}).resolution;
  const done = !!(S.status && S.status.setup_complete);

  const configured = (e.configured || []).map(c => `
    <tr><td><span class="dot ${c.port_open === true ? "ok" : c.port_open === false ? "bad" : "unknown"}"></span>
        ${esc(c.instance)}</td>
        <td>${esc(c.serial || "— not set yet —")}</td>
        <td>${c.port_open === true ? '<span class="ok">reachable</span>'
             : c.port_open === false ? '<span class="bad">not reachable</span>' : ""}</td></tr>`).join("");

  // the adb binary of an instance's family, from the install scan - adopt
  // writes it into config so BlueStacks drives with HD-Adb.exe, MuMu with
  // its own adb.exe (mixing them kills the shared daemon)
  const adbFor = fam => ((e.scanned || []).find(s => s.adb && !/^adb$/i.test(s.adb)
    && (s.emulator || "").startsWith((fam || "").split(" ")[0])) || {}).adb || "";
  // the emulator config already points at gets a status, not a button: "Use
  // this one" on it was a visible no-op (user, 2026-09-08)
  const inUse = new Set((e.configured || []).map(c => c.serial).filter(Boolean));
  const useOrStatus = (serial, adb) => inUse.has(serial)
    ? '<span class="chip ok" title="config.yaml points at this emulator">In use ✓</span>'
    : `<button class="small" onclick='adopt(${JSON.stringify(serial)}, ${JSON.stringify(adb)})'>Use this one</button>`;
  const rows = [];
  for (const i of (e.instances || [])) {
    const serial = i.adb_port ? `127.0.0.1:${i.adb_port}` : null;
    rows.push(`<tr>
      <td>${esc(i.emulator || "?")}</td><td>${esc(i.name || "")}</td>
      <td>${i.running ? '<span class="ok">running</span>' : '<span class="muted">off</span>'}
          ${i.adb_enabled === false ? '<div class="bad" style="font-size:.85em">ADB switch off in BlueStacks</div>' : ""}
          ${i.display && i.display_ok === false ? `<div class="bad" style="font-size:.85em">display ${esc(i.display)}, needs 2560x1080@360 landscape</div>` : ""}</td>
      <td>${esc(serial || "")}</td>
      <td style="white-space:nowrap">
        ${serial && i.running ? useOrStatus(serial, adbFor(i.emulator)) : ""}
        ${i.running && serial === ((e.configured || []).find(c => c.instance === e.active_instance) || {}).serial
          && ['MuMu', 'BlueStacks'].includes(i.emulator)
          ? `<button class="small" onclick="launchVM('${esc(i.emulator)}', '${esc(String(i.index))}')">Open The Tower</button>` : ""}
        ${!i.running && i.index !== undefined
          && ((i.emulator||"").startsWith("MuMu") || (i.emulator||"").startsWith("BlueStacks"))
          ? `<button class="small ghost" onclick="launchVM('${esc(i.emulator)}', '${esc(String(i.index))}')">Start it</button>` : ""}
        ${!i.running && (i.emulator||"").startsWith("BlueStacks") && (i.adb_enabled === false || i.display_ok === false)
          ? `<button class="small ghost" onclick="prepareBS('${esc(String(i.index))}')" title="ADB on + 2560x1080 landscape @ 360 dpi in bluestacks.conf (backup kept)">Prepare</button>` : ""}
      </td></tr>`);
  }
  for (const f of (e.scanned || []))
    for (const dv of (f.devices || []))
      rows.push(`<tr><td>${esc(f.emulator)}</td><td class="muted">adb device</td><td></td>
        <td>${esc(dv)}</td>
        <td>${useOrStatus(dv, f.adb || "")}</td></tr>`);

  const sug = e.suggestion ? `
    <p><b class="warn">Suggestion:</b> exactly one emulator is up
      (${esc(e.suggestion.emulator || "")} ${esc(e.suggestion.name || "")} at ${esc(e.suggestion.serial)}) —
      <button class="small" onclick="adopt('${esc(e.suggestion.serial)}', '${esc(e.suggestion.adb || "")}')">
        connect to it</button></p>` : "";

  $("#view").innerHTML = `
  <article>

    <p id="tools-status" role="status" aria-live="polite">${esc(S.tools.installed ? '✓ Connection tools installed' : S.tools.message || 'Prepare connection tools first')}</p>
    <progress id="tools-progress" max="100" value="${S.tools.percent || 0}" ${S.tools.installed ? 'hidden' : ''}></progress>
    ${!S.tools.installed ? `<label class="inline"><input id="tools-license" type="checkbox">I accept the <a href="https://developer.android.com/tools/releases/platform-tools" target="_blank" rel="noopener">Android SDK terms</a> for this download.</label><button id="install-tools" onclick="installConnectionTools()">Install connection tools</button>` : ''}
  </article>
  ${accountSetupHtml()}
  <article>
    <header><span class="step-num">1</span>Connect your emulator
      ${done ? '<span class="chip ok">setup complete ✓</span>' : ""}</header>
    <p class="muted">Tower Pilot drives The Tower inside an Android emulator
      (MuMu Player recommended). Start your emulator with the game installed,
      then pick it below. Everything is saved for you — no files to edit.</p>
    ${e.error ? `<p class="bad">${esc(e.error)}</p>` : ""}
    ${sug}
    <h6 style="margin-bottom:.3rem">Detected on this computer</h6>
    <table><thead><tr><th>Emulator</th><th>Instance</th><th>State</th><th>Address</th><th></th></tr></thead>
      <tbody>${rows.join("") || '<tr><td colspan="5" class="muted">Nothing detected — is your emulator installed and running?</td></tr>'}</tbody></table>
    <h6 style="margin-bottom:.3rem">Currently configured</h6>
    <table><tbody>${configured}</tbody></table>
    <button class="ghost" onclick="renderSetup()">↻ Re-scan</button>
    <p id="boot-state" role="status" aria-live="polite"></p>
  </article>

  <article>
    <header><span class="step-num">2</span>Check the screen</header>
    <p class="muted">Keep your preferred portrait resolution. Scanning detects
      its size and DPI, applies the layout profile, and verifies controls on your screen.</p>
    ${res ? (res.ok
        ? `<p>${res.expected ? '<span class="ok">✓ ' : '<span class="warn">⚠ '}
             ${res.width} × ${res.height}</span> ${esc(res.note || "")}</p>`
        : `<p class="bad">${esc(res.error || "check failed")}</p>`)
      : `<p class="muted">Not checked yet — connect an emulator first.</p>`}
    <button class="ghost" onclick="checkResolution()">Check now</button>
  </article>

  <article>
    <header><span class="step-num">3</span>Scan your account</header>
    <p class="muted">With the game open on its Home screen, this reads what
      your account owns — guardians, card presets, equipped modules — so runs
      can be tailored to it and never tap an ability you don't have.
      Setup also runs a short test battle and saves the results automatically. The confirmation explains the test before it starts.</p>
    <div id="scan-box"><a href="#calibrate" role="button">Continue to map my game</a>
      <span id="scan-state" class="muted"></span></div>
  </article>

  ${done ? `<article><p><b class="ok">Emulator connection is configured.</b>
     ${calibOk() ? 'Recognition setup is complete. Continue to <a href="#home">Control</a>.' : 'Next: <a href="#calibrate">scan the game and capture recognition images</a>. Control unlocks after the scan is complete.'}</p></article>` : ""}`;
}

async function installConnectionTools(){
  if (!$("#tools-license")?.checked) { toast("Accept the Android SDK terms to install connection tools", true); return; }
  const button = $("#install-tools");
  if (button) button.disabled = true;
  try {
    await post("/api/wizard/tools/install", {accept_license:true});
    while (S.view === "setup") {
      const r = await api("/api/wizard/tools");
      if ($("#tools-status")) $("#tools-status").textContent = r.message;
      const bar = $("#tools-progress");
      if (bar) { if (r.percent == null) bar.removeAttribute("value"); else bar.value=r.percent; }
      if (r.stage === "error") throw new Error(r.message);
      if (r.installed) { await renderSetup(); return; }
      await new Promise(resolve => setTimeout(resolve, 700));
    }
  } catch(e) { toast(e.message, true); }
  finally { if (button) button.disabled = false; }
}

async function adopt(serial, adb){
  try {
    const r = await post("/api/wizard/adopt", adb ? { serial, adb } : { serial });
    if (!r.connected) throw new Error(r.message || "Emulator is not connected yet");
    toast("Connected to " + serial);
    await checkResolution(serial);
    await loadStatus();
    renderSetup();
  } catch(e){ toast(e.message, true); }
}
async function prepareBS(index){
  if (!window.confirm("Write to BlueStacks' own config (bluestacks.conf):\n- Android Debug Bridge: on\n- display 2560 x 1080 landscape, 360 dpi (the game rotates it to portrait)\n\nA backup of the file is kept. BlueStacks must be closed. Continue?")) return;
  try {
    const r = await post("/api/wizard/bluestacks/prepare", { index });
    toast(r.message || "prepared");
    renderSetup();
  } catch(e){ toast(e.message, true); }
}
function renderBootStatus(){
  const el = $("#boot-state"); if (!el || !S.status) return;
  const running = (S.status.processes || []).some(p => p.runner === "boot");
  const event = (S.status.events || []).filter(e => ["boot_stage","boot_done"].includes(e.kind) || (e.kind === "runner_crashed" && e.flow === "boot")).at(-1);
  if (!running && event?.kind === 'boot_done' && event.ok && S.view === 'setup' && S.bootRefreshed !== event.t) {
    S.bootRefreshed = event.t;
    renderSetup().catch(e => toast(e.message, true));
  }
  el.textContent = running ? `Starting emulator${event?.stage ? ": " + event.stage : ""}…`
    : event?.kind === "boot_done" && event.ok ? (event.calibration_required ? "Game started — scan required. Continue to Calibrate; no recognition images have been assumed." : "Game started and screen recognized.")
    : event && (event.ok === false || event.kind === "runner_crashed") ? `Boot stopped: ${event.error || event.stage || "check the emulator"}.`
    : "No emulator launch in progress.";
}
async function launchVM(emulator, index){
  try {
    const r = await post("/api/wizard/launch", { emulator, index });
    toast(r.message || "launch requested");
  } catch(e){ toast(e.message, true); }
}
async function checkResolution(serial){
  const s = serial ||
    ((S.emus && S.emus.configured || []).find(c => c.serial) || {}).serial;
  if (!s) { toast("no configured emulator to check", true); return; }
  try {
    await api("/api/wizard/resolution?serial=" + encodeURIComponent(s));
    await loadStatus();
    if (S.view === "setup") renderSetup();
  } catch(e){ toast(e.message, true); }
}
async function startScan(){
  try {
    await post("/api/scan/start", {});
    $("#scan-state").textContent = "scanning…";
    pollScan();
  } catch(e){ toast(e.message, true); }
}
function pollScan(){
  clearInterval(S.scanPoll);
  S.scanPoll = setInterval(async () => {
    try {
      const st = await api("/api/scan/status");
      const el = $("#scan-state");
      if (!el) { clearInterval(S.scanPoll); return; }
      if (st.running) el.textContent = "scanning… " + (st.stage || "");
      else {
        clearInterval(S.scanPoll);
        el.innerHTML = '<span class="ok">scan finished</span> — its result is a draft profile you can activate on the Control page.';
      }
    } catch(e){ clearInterval(S.scanPoll); }
  }, 2000);
}

/* ====================================================== VIEW 2: CALIBRATE */
function calibrationPreferences(){
  const cfg = S.config || {}, inst = cfg.instances?.[cfg.active_instance] || {};
  const key = JSON.stringify([cfg.active_instance, inst.account, inst.serial]);
  S.calibrationChoices ||= {};
  if (!S.calibrationChoices[key]) {
    let saved;

function calibrationKnowledge(st){
  const phases = st.state?.phases || {}, entries = st.report?.entries || [];
  const features = [["cards","Cards and presets","names"],["modules","Modules","preset_tabs"],["global","Global presets","global_presets"],["guardians","Guardians","guardians"],["bots","Bots","bots"],["workshop","Workshop presets","workshop"]];
  const player = st.report?.player || {}, manifest = st.manifest;
  return features.map(([key,label,field]) => {
    const phase = phases[key], results = phase?.results || {};
    const evidence = entries.filter(e => e.phase === key || (key === "modules" && e.rel?.startsWith("modules/")));
    const verified = evidence.filter(e => e.verified === true).length;
    const attention = evidence.filter(e => ["stale","rejected","unverified_copy"].includes(e.status)).length;
    const unverified = evidence.filter(e => e.verified !== true && !["stale","rejected","unverified_copy"].includes(e.status)).length;
    const observedNames = key === "cards" ? evidence.filter(e=>e.rel?.startsWith("cards/preset_")).map(e=>e.name)
      : key === "global" ? player.global_presets : player.category_presets?.[key];
    let found = (results[field] || observedNames || []).join(", ");
    if (key === "cards") {
      const inventory = st.card_manifest || results.inventory;
      const cards = inventory?.cards || player.cards_observed || [];
      const presets = results.names || observedNames || [];
      const active = inventory?.active ?? cards.filter(c=>c.active).length;
      const mastered = inventory?.mastered ?? cards.filter(c=>c.mastery).length;
      found = `${cards.length} cards identified; ${inventory?.complete ? 'full inventory verified' : 'full inventory not yet confirmed'}; ${presets.length} presets`;
      if(active) found += `; ${active} active`;
      if(mastered) found += `; ${mastered} mastered`;
      if(cards.length) found += ': ' + cards.map(c=>c.name + (c.active ? ' ✓' : '') + (c.mastery ? ' ★' : '')).join(', ');
    }
    if (key === "modules" && (phase || manifest?.slots?.length || evidence.length)) {
      const total = manifest?.inventory_complete ? `${manifest.inventory.length} modules recorded in the full scan` : player.module_inventory_complete ? "Equipped slots and full inventory scanned" : "Full inventory not yet confirmed";
      found = `${total}; ${(player.modules_equipped || []).length} equipped; ${(player.modules_copies || []).length} inventory copies recorded`;
      if (manifest?.slots) found += `; ${manifest.slots.filter(r => r.state === "locked").length} locked slots`;
    }
    return `<tr><th scope="row">${label}</th><td>${esc(phase?.status === "done" ? "Scanned" : phase?.status || (evidence.length ? "Saved evidence" : "Not scanned"))}${found ? `<div class="muted">${esc(found)}</div>` : ""}${phase?.error ? `<div class="bad">${esc(phase.error)}</div>` : ""}</td><td>${evidence.length ? `${verified} verified${attention ? `<div class="bad">${attention} need attention</div>` : ""}${unverified ? `<div class="muted">${unverified} not yet verified</div>` : ""}` : "No image verification recorded"}</td></tr>`;
  }).join("");
}

  const account = S.config.instances[instance]?.account;
  const until = Date.now()+120000;
  S.clientClickerBusy = true;
  const controls = document.querySelectorAll('#client-clicker select, #client-clicker [onclick^="clientClicker"]');
  controls.forEach(el=>el.disabled=true);
  const active = () => generation === clientClickerGeneration && location.hash === '#calibrate' && !document.hidden;
  const report = message => {
    if (!$("#clicker-status")) return;
    $("#clicker-status").textContent = message;
    const li = document.createElement('li'); li.textContent = new Date().toLocaleTimeString()+' — '+message;
    const history = $("#clicker-history"); history.prepend(li);
    while(history.children.length>20) history.lastElementChild.remove();
  };
  try {
    do {
      if (!active()) break;
      report('Checking the current screen and manifest position…');
      let result = (await post('/api/clicker/step',{action,instance,account,execute:false})).result;
      const img = $("#clicker-preview");
      if (img) { img.src='/api/clicker/frame?t='+Date.now(); img.style.display='block'; }
      report(result.reason);
      if (!active() || mode === 'preview') break;
      if (result.ok) {
        report('Verifying a second frame and sending one click…');
        result = (await post('/api/clicker/step',{action,instance,account,execute:true})).result;
        report(result.reason);
        break; // Never retry a click whose outcome is uncertain.
      }
      if (mode !== 'watch') break;
      await new Promise(resolve=>setTimeout(resolve,2500));
    } while(Date.now()<until);
    if (mode === 'watch' && Date.now()>=until) report('Watch finished without a verified target. No click sent.');
  } catch(e){ report('Stopped: '+e.message); }
  finally {
    S.clientClickerBusy=false;
    controls.forEach(el=>el.disabled=false);
  }
}

/* ---- the cropper: drag a box on the live frame, save it as a template.
   Coordinates are converted from the scaled <img> to native pixels through
   naturalWidth/clientWidth; the frame's ts is posted back so the server
   cuts from the very frame the box was drawn on. */
const CROP = { rect:null, drag:null };
function cropSizeCanvas(){
  // Match the drawing buffer to the *displayed* image size. The CSS keeps the
  // canvas at 100% of the image, so a stale/natural measurement can never make
  // it overflow onto the controls below; this only keeps the pixels crisp and
  // the drag coordinates aligned with the cursor.
  const img = $("#calib-frame"), cv = $("#crop-canvas");
  if (!img || !cv || !img.clientWidth) return;
  if (cv.width !== img.clientWidth || cv.height !== img.clientHeight){
    cv.width = img.clientWidth; cv.height = img.clientHeight;
    CROP.rect = null; CROP.drag = null;   // old selection no longer maps to the new size
  }
  cropDraw();
}
function cropInit(){
  const img = $("#calib-frame"), cv = $("#crop-canvas");
  if (!img || !cv) return;
  CROP.rect = null;
  cropSizeCanvas();
  if (!CROP._ro && window.ResizeObserver){   // keep the canvas synced as the layout reflows
    CROP._ro = new ResizeObserver(() => cropSizeCanvas());
    CROP._ro.observe(img);
  }
  const pos = ev => {
    const b = cv.getBoundingClientRect();
    return [Math.max(0, Math.min(cv.width, ev.clientX - b.left)),
            Math.max(0, Math.min(cv.height, ev.clientY - b.top))];
  };
  cv.onmousedown = ev => { CROP.drag = pos(ev); CROP.rect = null; ev.preventDefault(); };
  cv.onmousemove = ev => {
    if (!CROP.drag) return;
    const [x, y] = pos(ev), [x0, y0] = CROP.drag;
    CROP.rect = [Math.min(x0, x), Math.min(y0, y), Math.abs(x - x0), Math.abs(y - y0)];
    cropDraw();
  };
  cv.onmouseup = cv.onmouseleave = ev => {
    if (!CROP.drag) return;
    CROP.drag = null; cropDraw(); cropInfo();
  };
}
function cropDraw(){
  const cv = $("#crop-canvas"); if (!cv) return;
  const g = cv.getContext("2d"); g.clearRect(0, 0, cv.width, cv.height);
  if (!CROP.rect) return;
  const [x, y, w, h] = CROP.rect;
  g.strokeStyle = "#7cf"; g.lineWidth = 2; g.strokeRect(x + .5, y + .5, w, h);
  g.fillStyle = "rgba(120,200,255,.15)"; g.fillRect(x, y, w, h);
}
function cropNative(){
  const img = $("#calib-frame"); if (!img || !CROP.rect) return null;
  const k = img.naturalWidth / img.clientWidth;
  const [x, y, w, h] = CROP.rect.map(v => Math.round(v * k));
  return { x, y, w, h };
}
function cropInfo(msg){
  const el = $("#crop-info"); if (!el) return;
  const n = cropNative();
  el.textContent = msg || (n ? `box ${n.x},${n.y} ${n.w}×${n.h} native px — name it and save`
                             : "Drag a box on the live screen.");
}

function confirmPreparation(message){

    const dialog = document.createElement('dialog');
    dialog.setAttribute('aria-label', 'Prepare this run');
    dialog.innerHTML = `<article><header>Prepare this run</header><div role="alert" style="border:2px solid #f5b942;border-radius:12px;padding:18px;margin:16px 0;background:#402f18;color:#fff"><strong style="font-size:1.3em">Before scanning: end all battles and open Home</strong><p>Returning to Home can leave a battle running. Finish or surrender that battle first, then return to the game's Home screen. Do not start a scan during a tournament.</p></div><p style="white-space:pre-line">${esc(message)}</p><footer><button class="ghost" data-cancel>Cancel</button><button data-continue>Continue preparation</button></footer></article>`;
    document.body.appendChild(dialog);

    dialog.querySelector('[data-continue]').onclick = () => { accepted = true; dialog.close(); };

async function prepareRun(selected){
  if (S.prepareBusy) return;
  const run = selected || $('#start-preset')?.value || S.readiness?.preset;
  if (!run) { toast('Choose a run first.', true); return; }
  S.prepareBusy = true;
  document.querySelectorAll('[data-prepare-run]').forEach(el => el.disabled = true);
  try {
    const before = await api('/api/calibrate/status');
    if (before.running) throw new Error('A scan is already running. Let it finish first.');
    if (before.restore_pending) throw new Error('Restore the saved module setup before preparing a run.');
    preparationMessage('Using your completed scan…');
    if (Object.keys(before.state?.player || {}).length) await post('/api/calibrate/apply', {});
    let result = await api('/api/readiness?preset=' + encodeURIComponent(run));
    if (result.ready) {
      preparationMessage('Ready. You can start this run from Control.');
      await loadStatus();
      if (S.view === 'home') await renderHome(); else await renderCalibrate();
      return;
    }
    if (result.next_action === 'edit_run') {
      preparationMessage(result.message);
      await loadHomeData();
      openEditor(run.replace(/^bp_/, ''));
      return;
    }
    const accepted = await confirmPreparation('Prepare the missing run controls?\n\nYour completed discoveries have been saved. The automatic setup will reuse your menu and inventory scan and start a temporary normal battle to verify battle controls, weapons and the wave counter, then end only that battle. It will not enter a tournament or purchase anything.\n\nAllow approximately 3–6 minutes. Second Wind is optional and will not hold up preparation. Keep the game on Home, leave the emulator untouched, and you may refresh this dashboard; it will reconnect to the scan and apply the results when finished.\n\nContinue?');
    if (!accepted) { preparationMessage('Discoveries saved. Battle preparation has not started.'); return; }
    const previous = JSON.stringify(before.state);
    preparationMessage('Preparing recognition automatically…');
    localStorage.setItem(preparationStorageKey(), JSON.stringify({preset:run,started:Date.now()/1000}));
    await post('/api/calibrate/start', {bootstrap:true, flows:true, battle_only:true, phases:'c,m', overwrite:false, allow_navigation:true});
    S.calibrationPreset = run;
    location.hash = '#calibrate';
    const started = Date.now();
    let seenWorker = false;
    while (true) {
      await new Promise(resolve => setTimeout(resolve, 1200));
      const status = await api('/api/calibrate/status');
      seenWorker = seenWorker || status.running || JSON.stringify(status.state) !== previous;
      if (!seenWorker && Date.now() - started > 30000) throw new Error('The scan did not start. Please try Prepare this run again.');
      if (status.running || !seenWorker) continue;
      const phase = status.state?.phases?.bootstrap;
      if (status.restore_pending || !['done', 'needs_attention'].includes(phase?.status))
        throw new Error('Preparation stopped. See the latest scan step for the reason.');
      await post('/api/calibrate/apply', {});
      result = await api('/api/readiness?preset=' + encodeURIComponent(run));
      localStorage.removeItem(preparationStorageKey());
      preparationMessage(result.ready ? 'Ready. You can start this run from Control.' : 'Discoveries saved. ' + (result.message || 'Some controls were not visible during preparation. The remaining checks are listed below.'));
      await loadStatus();
      if (S.view === 'home') await renderHome(); else await renderCalibrate();
      break;
    }
  } catch(e) { preparationMessage(e.message); toast(e.message, true); }
  finally {
    S.prepareBusy = false;
    document.querySelectorAll('[data-prepare-run]').forEach(el => el.disabled = false);
  }
}

function scanTimelineHTML(record, running=false, title="Scan progress"){
  const labels = {pending:"Waiting",running:"In progress",done:"Done",skipped:"Skipped",needs_attention:"Needs attention",error:"Failed",stopped:"Stopped"};
  const symbols = {pending:"○",running:"●",done:"✓",skipped:"–",needs_attention:"!",error:"!",stopped:"■"};
  const steps = record?.steps || [];
  if (!steps.length) return record ? `<p class="muted">Step history will appear on the next scan. The previous scan's result is shown above.</p>` : '<p class="muted">Progress and step history will appear here when a scan starts.</p>';
  const complete = steps.filter(s=>["done","skipped","needs_attention"].includes(s.status)).length;
  const skipped = steps.filter(s=>s.status === "skipped").length;
  const interrupted = !running && record.status === "running";
  const state = interrupted ? "Stopped before completion" : labels[record.status] || "Ready";
  const history = record.history || [];
  const units = steps.find(s=>s.status === "running")?.units;
  const clock = t=>new Date(t*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const elapsed = step=>step.started_at && step.finished_at ? ` · ${Math.max(0,Math.round(step.finished_at-step.started_at))}s` : "";
  return `<section class="scan-progress" aria-label="${esc(title)}">
    <div class="scan-progress-heading"><b>${esc(title)}</b><span>${complete}/${steps.length} steps finished${skipped ? ` · ${skipped} skipped` : ""}</span></div>
    <progress value="${complete}" max="${steps.length}" aria-label="${esc(title)}: finished steps"></progress>
    <p class="scan-action" role="status" aria-live="polite">${esc(state)}${record.message ? ` — ${esc(record.message)}` : ""}</p>
    <p class="muted" style="font-size:.8rem">Progress tracks finished steps; their durations vary. ${record.updated_at ? `Last update ${esc(clock(record.updated_at))}.` : ""}</p>
    ${units && units.total>0 ? `<p class="muted">${esc(units.label)}: ${Number(units.completed).toLocaleString()} / ${Number(units.total).toLocaleString()}</p><progress aria-label="${esc(units.label)}" value="${Math.max(0,Math.min(units.completed,units.total))}" max="${units.total}"></progress>` : ""}
    <ol class="scan-stops" aria-label="Scan steps">${steps.map((step,i)=>{
      const status = interrupted && step.status === "running" ? "stopped" : (labels[step.status] ? step.status : "pending");
      return `<li class="scan-step-${status}" data-step="${esc(step.id || i)}" ${status === "running" ? 'aria-current="step"' : ""} title="${esc(step.message || step.label)}"><span class="scan-dot" aria-hidden="true">${symbols[status]}</span><b>${esc(step.label)}</b><small>${labels[status]}${elapsed(step)}</small></li>`;
    }).join("")}</ol>
    ${history.length ? `<details open><summary>Activity history (${history.length})</summary><ol class="scan-history" reversed>${[...history].reverse().map(e=>`<li><time>${esc(clock(e.at))}</time>${esc(e.message)}</li>`).join("")}</ol></details>` : ""}
    ${record.skipped?.length ? `<details open><summary>Skipped captures and menus (${record.skipped.length})</summary><ul>${record.skipped.map(e=>`<li>${esc(e.screen || e.target)}: ${esc(e.reason)}${e.optional ? ' <span class="muted">(optional - captured during play when it appears)</span>' : ""}</li>`).join("")}</ul></details>` : ""}
  </section>`;
}
function renderScanTimeline(selector, record, running, title){
  const el=$(selector); if (!el) return;
  const html=scanTimelineHTML(record,running,title);
  if (el._timelineHTML === html) return;
  const previous=el.querySelector('.scan-stops');
  const left=previous?.scrollLeft || 0, top=previous?.scrollTop || 0;
  const oldActive=el.dataset.active;
  const active=running ? record?.active_step || '' : '';
  el.innerHTML=html; el._timelineHTML=html; el.dataset.active=active;
  const track=el.querySelector('.scan-stops');
  if (track) { track.scrollLeft=left; track.scrollTop=top; }
  if (track && active && active !== oldActive) {
    const current=track.querySelector('[aria-current="step"]');
    if (current) {
      if (track.scrollWidth>track.clientWidth) track.scrollLeft=current.offsetLeft-track.offsetLeft-track.clientWidth/2+current.clientWidth/2;
      else track.scrollTop=current.offsetTop-track.offsetTop;
    }
  }
}

function calibrationMode(st){
  return st.selection?.mode || (st.running && st.state?.phases?.bootstrap?.status === "running" ? "bootstrap" : "basic");
}
function basicScanProgress(st){
  if (calibrationMode(st) === "observe") return null;
  const phases=st.state?.phases || {};
  const names={c:"cards",m:"modules",g:"global",u:"guardians",b:"bots",w:"workshop",e:"equipped_modules"};
  const labels={cards:"Cards and presets",modules:"Module inventory",global:"Global presets",guardians:"Guardians",bots:"Bots",workshop:"Workshop presets",equipped_modules:"Scan and restore modules"};
  const keys=calibrationMode(st) === "basic" && st.running ? (st.selection?.phases || []).map(k=>names[k]).filter(Boolean) : Object.keys(phases).filter(k=>k !== "bootstrap");
  if (!keys.length) return null;
  const steps=keys.map(key=>({id:key,label:labels[key] || key,status:phases[key]?.status || "pending",message:phases[key]?.error || phases[key]?.at,started_at:phases[key]?.started_at,finished_at:phases[key]?.finished_at}));
  const history=steps.flatMap(step=>[
    ...(step.started_at ? [{at:step.started_at,message:`Started ${step.label}`}] : []),
    ...(step.finished_at ? [{at:step.finished_at,message:`${step.label}: ${step.status}${step.message ? ` — ${step.message}` : ""}`}] : [])
  ]).sort((a,b)=>a.at-b.at);
  const activity=calibrationMode(st) === "bootstrap" ? null : st.activity;
  const message=activity?.kind === "calibrate_cut" ? `Checking ${activity.name}` : activity?.message;

  document.querySelectorAll('#client-remap, #bootstrap-start, [onclick^="startCalibrate"], [onclick^="observeNow"], #calib-phase2, [name="calibration-phase"], #calib-taps, #calib-over, [onclick="applyCalibration()"]')

function pollCalibrate(){

  const generation = S.calPollGeneration = (S.calPollGeneration || 0) + 1;
  const tick = async () => {
    if (generation !== S.calPollGeneration || !$("#calib-report")) return;
    try {
      const st = await api("/api/calibrate/status");
      if (generation !== S.calPollGeneration || !$("#calib-report")) return;
      calibReport(st);
    } catch(e){
      const progress = $("#calib-progress");
      if (progress) progress.textContent = "Connection interrupted. Retrying calibration status…";
      const action = $("#bootstrap-timeline .scan-action");
      if (action) action.textContent = "Connection interrupted. Retrying; showing the last known steps...";
      const timeline = $("#bootstrap-timeline");
      if (timeline) timeline._timelineHTML = null;
    }
    if (generation === S.calPollGeneration && $("#calib-report")) S.calPoll = setTimeout(tick, 2500);
  };
  tick();
}

function behUsedBy(sec, name){

async function behNew(sec){
  const inp = $("#new-" + sec);
  const name = (inp && inp.value || "").trim();
  if (!/^[a-z][a-z0-9_]*$/.test(name)) {
    toast("name: lowercase letters, digits and _ , starting with a letter", true);
    return;
  }
  if (((S.profile.policies || {})[sec] || {})[name]) {
    toast(`${name} already exists`, true); return;
  }
  if (await patch(["policies", sec, name],
                  JSON.parse(JSON.stringify(BEH_TEMPLATES[sec])))) {
    renderBehaviors();
    window[BEH_FAMILIES.find(f => f.sec === sec).open](name, "");
  }

async function behDup(sec, name){
  const all = (S.profile.policies || {})[sec] || {};
  if (!all[name]) return;
  let copy = `${name}_copy`; let i = 2;
  while (all[copy]) copy = `${name}_copy${i++}`;
  if (await patch(["policies", sec, copy],
                  JSON.parse(JSON.stringify(all[name])))) renderBehaviors();
}
async function behDel(sec, name){
  const used = behUsedBy(sec, name);
  if (used.length) { toast(`${name} is in use by ${used.join(", ")}`, true); return; }
  if (!confirm(`Delete ${name}? A timestamped profile backup is kept.`)) return;
  if (await patch(["policies", sec, name], null, "delete")) renderBehaviors();
}

function renderRunner(){
  const body = $("#runner-body");
  if (!body || !S.status) return;
  // The status poll calls this every 2.5s. A blind innerHTML rewrite slams
  // the preset dropdown shut mid-choice, so: never rewrite while the user
  // is inside a form control here, and only rewrite when the content that
  // drives the card actually changed.
  const ae = document.activeElement;
  if (ae && body.contains(ae) && ae.matches("select, input, textarea")) return;
  const procs = S.status.processes || [];
  const ready = S.runReadiness || {};
  const key = JSON.stringify([procs.map(p => [p.pid, p.runner]),
                              !!S.status.stop_flag,
                              Object.entries(ready).map(([n, r]) => [n, r.ready, (r.missing || []).length])]);
  if (body.dataset.key === key) return;
  body.dataset.key = key;
  const chosen = ($("#start-preset") || {}).value;
  // Each run type needs its own images to click (its flow's templates, the
  // gather features, its presets, the shared recognition guards). A run whose
  // images exist can start; one that lacks some is greyed out with the list
  // to scan - what another run type still lacks does not hold this one back.
  const presets = Object.entries(S.runs || {})
    .filter(([n, b]) => (b || {}).defined !== false)
    .map(([n, b]) => {
      const r = ready[n];                       // undefined for combo: not gated here
      const ok = !r || r.ready;
      const miss = (r && r.missing) || [];
      const title = ok ? "" : `Needs ${miss.length} image${miss.length === 1 ? "" : "s"} before it can start:\n` +
        miss.slice(0, 8).map(m => " - " + m).join("\n") + (miss.length > 8 ? `\n   … and ${miss.length - 8} more` : "") +
        "\nOpen Calibrate (Check setup) to scan or crop them.";
      return { name:n, label:(b || {}).label || n, ok, miss, title:r?.setup_required ? "Review equipment and abilities" : title, setupRequired:r?.setup_required };
    });
  const firstReady = (presets.find(p => p.name === "bp_coin_default" && p.ok) || presets.find(p => p.ok) || presets[0] || {}).name;
  const tapsAllowed = !!S.config.instances?.[S.config.active_instance]?.allow_taps;
  body.innerHTML = `
    <label class="inline"><input type="checkbox" ${tapsAllowed ? "checked" : ""} ${procs.length ? "disabled" : ""} onchange="setAutomationAccess(this.checked)"> Allow automation to tap this emulator</label>
    ${!tapsAllowed ? '<p class="muted">Read-only: the game will not be controlled until you enable taps.</p>' : ""}
    ${procs.length ? procs.map(p => `
      <div class="flowcard"><div><b>${p.runner === "gem_collector" ? "Diamond collector" : esc(p.runner)}</b>
        <span class="chip">pid ${p.pid}</span>
        <div class="muted">${esc((p.cmdline || "").slice(0, 90))}</div></div>
        <button class="small danger" onclick="killPid(${p.pid})">Stop now</button>
      </div>`).join("")
      : '<p class="muted">Nothing is running.</p>'}
    <div style="display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-top:.6rem">
      <select id="start-preset" style="margin:0; width:auto; padding:.3rem .6rem" onchange="renderRunReady()">
        ${presets.map(p => `<option value="${esc(p.name)}" title="${esc(p.title)}"
            ${p.name === firstReady ? "selected" : ""}>${esc(p.label)}</option>`).join("")}
      </select>
      <button data-prepare-run onclick="prepareRun()">Prepare this run</button><button id="start-run" onclick="startPreset()">▶ Start</button>
      <button onclick="startGemsOnly()" ${procs.length ? "disabled" : ""}>Collect diamonds only</button>
      ${S.status.stop_flag
        ? `<button class="small ghost" onclick="ctl('clear_flag')">✋ will stop after this run — cancel?</button>`
        : `<button class="small ghost" onclick="ctl('stop_after_run')">Finish current run, then stop</button>`}
    </div>
    <div id="run-ready" class="muted" style="margin-top:.4rem"></div>
    <p class="prepare-run-status" role="status">${esc(S.prepareMessage || '')}</p>
    <p class="muted" style="margin-top:.4rem">“Combo (day plan)” runs the whole
      day plan below. “Stop now” never touches the game — a live run keeps
      playing; prefer “finish current run, then stop”.</p>`;
  if (chosen) {
    const sel = $("#start-preset");
    if (sel && [...sel.options].some(o => o.value === chosen && !o.disabled)) sel.value = chosen;
  }
  renderRunReady();
}
function renderRunReady(){
  // The chosen run's own calibration state, next to the Start button: what it
  // still needs to click is listed here and in the option's tooltip; Start is
  // disabled until those images exist. Runs whose images are complete start.
  const sel = $("#start-preset"), out = $("#run-ready"), btn = $("#start-run");
  if (!sel || !out) return;
  const running = !!S.status?.processes?.length;
  const prepare = document.querySelector('[data-prepare-run]');
  if (prepare) prepare.disabled = running;
  if (running) {
    if (btn) btn.disabled = true;
    out.textContent = 'Automation is running. Use Stop now to stop the driver, or finish current run to stop after the battle.';
    return;
  }
  const r = (S.runReadiness || {})[sel.value];
  if (!r) { out.innerHTML = ""; if (btn) btn.disabled = false; return; }
  const miss = r.missing || [], adv = r.advisory || [];
  if (btn) btn.disabled = !r.ready;
  if (r.setup_required) {
    out.innerHTML = `<p>${esc(r.message || 'This run needs preparation. Click Prepare this run above.')}</p>`;
    return;
  }
  if (r.ready) {
    out.innerHTML = `<span class="ok">Ready to start.</span>`;
  } else {
    const details = r.details || miss.map(m => ({alternatives:[m], reasons:[], docs:[]}));
    out.innerHTML = `<p>Click <b>Prepare this run</b> above to finish ${miss.length} remaining recognition checks. Your completed scan will be reused.</p>` +
      `<details><summary>Recognition details</summary>${details.map(d => outstandingCard(d, "control", sel.value)).join("")}</details>`;
  }
}

function blueprintOptions(selected, kindFilter){

}
function blockRow(b, i, total){
  return `<div class="blockrow">
    <select onchange="setBlockBp(${i}, this.value)">${blueprintOptions(b.blueprint)}</select>
    <input placeholder="from" title="from HH:MM (empty = 00:00)" value="${esc(b.after || "")}"
           onchange="setBlockField(${i}, 'after', this.value)">
    <input placeholder="until" title="until HH:MM, exclusive (empty = midnight)" value="${esc(b.until || "")}"
           onchange="setBlockField(${i}, 'until', this.value)">

           value="${b.count ?? ""}" onchange="setBlockField(${i}, 'count', this.value)">
    <span style="white-space:nowrap">
      ${i > 0 ? `<button class="small ghost" onclick="moveBlock(${i},-1)">↑</button>` : ""}
      ${i < total - 1 ? `<button class="small ghost" onclick="moveBlock(${i},1)">↓</button>` : ""}

const KIND2BLOCK = { coin:"coin", shard:"shards", tournament:"tournament",
                     uw_grant_quest:"quest_sm", cycle_quest:"quest_ilm" };
async function setBlockBp(i, name){
  const list = dayList();
  const kind = ((S.profile.blueprints || {})[name] || {}).kind;
  list[i].blueprint = name;
  list[i].block = KIND2BLOCK[kind] || kind;
  saveDay(list);
}
async function setBlockField(i, key, val){
  const list = dayList();
  if (val === "" || val === null) delete list[i][key];
  else list[i][key] = (key === "count") ? Number(val) : val;
  saveDay(list);
}
async function moveBlock(i, d){
  const list = dayList();
  const [b] = list.splice(i, 1); list.splice(i + d, 0, b);
  saveDay(list);
}
async function delBlock(i){
  const list = dayList(); list.splice(i, 1); saveDay(list);
}
async function addBlock(){
  const bps = Object.entries(S.profile.blueprints || {});
  if (!bps.length) { toast("this profile has no blueprints yet", true); return; }
  const [name, b] = bps[0];
  const list = dayList();
  list.push({ block:KIND2BLOCK[(b || {}).kind] || (b || {}).kind, blueprint:name });
  saveDay(list);
}
function setWeek(day, val){
  if (val === "") queuePatch(["plan","week",day], null, "delete");

      <button class="small" onclick="openEditor('${esc(name)}')">Edit</button>
    </div>`;
  }).join("") || '<p class="muted">No run types defined in this profile.</p>';
}

function openRunTemplate(id){
  S.editorBp=null;
  const t=(S.runTemplates || []).find(t=>t.id===id);
  if (!t) return;
  let n=1, key=id+'_run', label=t.label;
  while (S.profile.blueprints?.[key] || Object.values(S.profile.blueprints || {}).some(b=>b.label===label)) {
    n++; key=id+'_run_'+n; label=t.label+' '+n;
  }
  S.templateRunId=key; S.templateChoice=id;
  const loadouts=Object.entries(S.config.loadouts || {}).filter(([,v])=>v?.defined!==false).map(([k])=>k);
  if (t.blueprint.kind==='coin') loadouts.unshift('as_is');
  const dlg=$('#editor');
  dlg.innerHTML=`<article><header><b>Add ${esc(t.label)}</b></header><p>${esc(t.description)}</p>
    ${t.requirements.map(r=>`<p>${esc(r)}</p>`).join('')}
    <label>Run name<input id="template-label" value="${esc(label)}"></label>
    <label>Tier<input id="template-tier" type="number" min="1" value="1"></label>
    <label>Equipment<select id="template-loadout">${loadouts.map(k=>`<option value="${esc(k)}" ${k===t.blueprint.loadout?'selected':''}>${k==='as_is'?'Keep current equipment':esc(k)+(Object.keys(S.config.loadouts[k] || {}).length?'':' (current equipment; no changes configured)')}</option>`).join('')}</select></label>
    ${t.blueprint.dissonant_tab?`<label>Disabled workshop tab<select id="template-tab">${dissonantTabs().map(k=>`<option value="${esc(k)}" ${k===t.blueprint.dissonant_tab?'selected':''}>${esc(dissonantTabLabel(k))}</option>`).join('')}</select></label>
    <label>Perk bans<textarea id="template-bans" rows="4" placeholder="one perk per line - a fragment of its wording, e.g. coins, but tower max health"></textarea></label><small>Set on the Home Perks dialog before each entry. Numbers are ignored when matching; leave empty to ban nothing.</small>`:''}
    <details><summary>Advanced run behaviour</summary>
    ${t.blueprint.kind==='shard'?'<label>Runs per batch<input id="template-count" type="number" min="1" value="100"></label>':''}
    ${t.blueprint.kind==='tournament'?'<label>Maximum gems for entry<input id="template-gems" type="number" min="0" value="0"></label><small>0 allows existing tickets and free ad entries, with no gem purchases. Saving this template does not enter a tournament.</small>':''}
    ${t.optional_policies.uw?'<label><input id="template-uw" type="checkbox">Use legacy weapon timing (requires verified owned weapons)</label>':''}
    ${t.optional_policies.rescue?'<label><input id="template-rescue" type="checkbox">Use legacy wall rescue (requires verified abilities and wall)</label>':''}
    </details><p>${t.notes.map(esc).join(' ')}</p><footer>
    <button onclick="saveRunTemplate()">Add run</button><button class="ghost" onclick="document.querySelector('#editor').close()">Cancel</button>
    </footer></article>`;
  dlg.showModal();
}

async function saveRunTemplate(){
  const options={label:$('#template-label').value.trim(),tier:Number($('#template-tier').value),loadout:$('#template-loadout').value};
  if ($('#template-count')) options.count=Number($('#template-count').value);
  if ($('#template-gems')) options.gem_entry_max=Number($('#template-gems').value);
  if ($('#template-tab')) options.dissonant_tab=$('#template-tab').value;
  // empty = leave the bans untouched (null); a list, even of one, is applied
  if ($('#template-bans') && perkLines($('#template-bans').value).length) options.perk_bans=perkLines($('#template-bans').value);
  if ($('#template-uw')) options.enable_uw=$('#template-uw').checked;
  if ($('#template-rescue')) options.enable_rescue=$('#template-rescue').checked;
  if (!(await saveAll())) return;
  try {
    await post('/api/run-templates/add',{profile:S.profiles.active,template:S.templateChoice,run_id:S.templateRunId,options});
    $('#editor').close(); await loadHomeData(); renderHome(); toast('Run added. It is ready to configure; nothing has been started.');
  } catch(e){toast(e.message,true);}
}

function setChore(name, enabled){
