<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Pilot</title>
<!-- Old-bookmark redirect (plan R17, brief decision 7, option A). The previous
     dashboard is gone; its anchors open the matching page of the app at
     /ui/app/. Anchors not listed keep their name; a query or sub-path after the
     page name is kept. No panels, styles, API calls or device work here. -->
<script id="aliases" type="application/json">
{"overview": "dashboard", "home": "dashboard", "screens": "recognition", "calibrate": "recognition",
 "setup": "emulators", "settings": "runtime", "rewards": "collection"}
</script>
<script>
(function () {
  var aliases = JSON.parse(document.getElementById('aliases').textContent);
  var hash = window.location.hash.replace(/^#\/?/, '');   // '#/name' is '#name', as in the app
  var cut = hash.search(/[?/]/);
  var page = cut < 0 ? hash : hash.slice(0, cut);
  var rest = cut < 0 ? '' : hash.slice(cut);
  if (Object.prototype.hasOwnProperty.call(aliases, page)) page = aliases[page];
  window.location.replace('/ui/app/' + (page ? '#' + page + rest : ''));
})();
</script>
</head>
<body>
<p>The dashboard has moved: <a href="/ui/app/">open the dashboard</a>.</p>
</body>
</html>
