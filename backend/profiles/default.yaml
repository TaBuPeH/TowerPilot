# Tower Pilot - the GENERIC STARTER profile (schema v1, profiles/SCHEMA.md).
#
# This file ships with the repo and is what `active_profile: default` binds
# on a fresh install. It knows NOTHING about any account - no preset names,
# no modules, no weapons, no wall, tier 1 - so nothing in it can be wrong
# about yours. How it gets filled in:
#   1. Calibrate page: cut your card preset tabs, preset picker rows and
#      module icons (the naming rules are on that page).
#   2. Setup page: "Scan account" records what those templates find in
#      profiles/<instance>.draft.yaml; --battle adds weapons and abilities.
#   3. Home page: "Promote" writes profiles/<name>.yaml = the scanned
#      player block on top of the blueprints, policies and plan below.
#   4. Configuration page: fill the loadouts with your preset names, raise
#      the tiers, bind `uw:` / `rescue:` policies to the blueprints.
# Your profile is git-ignored; this one is not - keep it generic.
#
# EVERY POLICY BELOW IS A LIBRARY ENTRY. The validator checks ownership
# where a blueprint BINDS a policy, not where it is defined, so the Chain
# Lightning choreographies and the wall rescues ship here for an account
# that has scanned nothing. No blueprint binds a rescue policy:
# `player.abilities_verified` stays false until scan.py --battle has seen
# the ability buttons (a burst taps the Demon Mode coordinate blind when no
# glyph matches). No blueprint binds a uw policy either - every one of them
# needs Chain Lightning, which nothing here owns yet.
player:
  seeded_from: starter (nothing scanned yet - owns nothing)
  uws: {chain_lightning: false, black_hole: false, death_wave: false, golden_tower: false,
    poison_swamp: false, spotlight: false, chronofield: false, inner_land_mines: false,
    smart_missiles: false}
  abilities: {nuke: false, demon_mode: false}
  abilities_verified: false
  # Preset names AS YOU NAMED THEM in the game. The scan fills these from
  # the templates you cut on the Calibrate page; the loadouts in
  # config.yaml refer to these names.
  card_presets: []
  global_presets: []
  category_presets: {workshop: [], modules: [], guardians: [], bots: []}
  guardians: []
  # Module slugs (player/catalogue.py). A loadout may only name modules that
  # appear in one of these two lists.
  modules_equipped: []
  modules_in_grid: []
  # Set true (and add a `rois.wall_bar` box in config.yaml) once the
  # account has a wall; the wall rescue policies bind only then.
  wall: false
  # Promote takes the tier the home screen showed at scan time.
  max_tier: 1
blueprints:
  # Coin farming with whatever is equipped (`as_is` = touch nothing). Raise
  # `tier` once Promote has set max_tier; add `uw: farm_cl_choreo` once the
  # scan shows chain_lightning; add `rescue: high_tier_wall` once
  # player.abilities_verified is true.
  coin_default:
    kind: coin
    label: Coin farming (as is)
    loadout: as_is
    tier: 1
    restart_via_home: true
    shop_interval_sec: 90
    shopping: default_sweep
    policies: {gather: all_on}
  # Tournament entry with the `tourney_1` loadout from config.yaml (empty
  # until you fill it in). Add `uw: tourney_cl` and
  # `rescue: tournament_wall_nuke` the same way as above.
  tourney_main:
    kind: tournament
    label: Tournament
    loadout: tourney_1
    gem_entry_max: 10
    tier: 1
    restart_via_home: true
    shop_interval_sec: 90
    shopping: default_sweep
    policies: {gather: all_on}
  # Rides along on a tournament run YOU play by hand: no shopping, no UW
  # toggles, no gem taps - only the rescue abilities, once a rescue policy
  # is bound. gem_entry_max 0: it never buys an entry, it adopts the run
  # already on screen.
  tourney_assist:
    kind: tournament
    label: Tournament assist (you play)
    loadout: tourney_1
    gem_entry_max: 0
    tier: 1
    restart_via_home: false
    policies: {gather: hands_off}
  coin_dissonance:
    kind: coin
    label: 'Achievement: Utility Dissonance'
    loadout: dissonance
    dissonant_tab: utility
    tier: 1
    restart_via_home: true
    shop_interval_sec: 90
    shopping: no_utility_sweep
    policies: {gather: all_on}
  shard_daily:
    kind: shard
    label: Shard farming
    loadout: shard_farm
    tier: 1
    count: 100
    policies: {gather: gems_only}
  quest_sm:
    kind: uw_grant_quest
    label: 'Quest: Smart Missiles'
    loadout: coin_farm
    tier: 1
    grant_targets: [smart_missiles]
    reroll_at_wave: 1000
    ride_to_wave: 6500
    rides: 1
    # all off: switching on a weapon the account does not own is refused.
    # Turn on the ones the scan shows (the quest rides best with golden
    # tower, black hole and spotlight on).
    uw_setup: {chain_lightning: false, death_wave: false, poison_swamp: false, golden_tower: false,
      black_hole: false, spotlight: false, chronofield: false}
  quest_ilm: {kind: cycle_quest, label: 'Quest: Inner Land Mines', loadout: inner_land_mines_quest,
    tier: 1, cycle_sec: 25, cycles: 40}
policies:
  uw_policies:
    farm_cl_choreo:
      baseline: {black_hole: true, chronofield: true, death_wave: true, golden_tower: true,
        poison_swamp: true, spotlight: true}
      chain_lightning:
        always_on_above: [6080, 6120]
        mode: fleet_marks
        off_after_waves: [53, 72]
        pre_mark_waves: [5, 25]
      label: Chain Lightning Farming Choreography
    tourney_cl:
      baseline: {black_hole: true, death_wave: true, golden_tower: true, poison_swamp: true,
        spotlight: true, chronofield: true}
      chain_lightning:
        mode: off_until_wave
        on_above: [500, 550]
      label: Tournament Chain Lightning
    tourney_cl_legend:
      baseline: {black_hole: true, death_wave: true, golden_tower: true, poison_swamp: true,
        spotlight: true, chronofield: true}
      chain_lightning:
        mode: off_until_wave
        on_above: [300, 330]
      label: Tournament Chain Lightning (Legend)
  rescue_policies:
    # Demon Mode when the wall overheal is nearly gone after Second Wind;
    # Nuke 3 waves after each fleet.
    high_tier_wall:
      label: High Tier Wall
      arm: {'on': second_wind, immunity_sec: null, watch_sec: 30}
      end_sprint_after_sw: false
      rules:
      - when: {bar: wall, below: 0.02, falling_samples: 2, deadband: 0.01}
        do:
          burst: {cancel_sprint: true, fire: demon_mode, retaps: 3}
      - when:
          wall_collapse: {from_above: 0.3}
        do:
          burst: {cancel_sprint: true, fire: demon_mode, retaps: 3}
      - when:
          fleet_mark: {after_waves: 3, window_waves: 60}
        do:
          fire: {button: nuke, throttle_sec: 5}
    # Tiers where the wall drains in seconds: fire at 40% and never stop
    # watching.
    t19_fast_drain:
      label: T19 Fast Drain
      arm: {'on': second_wind, immunity_sec: null, watch_sec: null}
      end_sprint_after_sw: false
      rules:
      - when: {bar: wall, below: 0.4, falling_samples: 2, deadband: 0.01}
        do:
          burst: {cancel_sprint: true, fire: demon_mode, retaps: 3}
      - when:
          wall_collapse: {from_above: 0.3}
        do:
          burst: {cancel_sprint: true, fire: demon_mode, retaps: 3}
      - when:
          fleet_mark: {after_waves: 3, window_waves: 60}
        do:
          fire: {button: nuke, throttle_sec: 5}
    tournament_any_falling:
      label: Tournament Any Falling
      arm: {'on': second_wind, immunity_sec: 8, watch_sec: null}
      end_sprint_after_sw: false
      rules:
      - when: {bar: wall, below: 0.5, falling_samples: 2, deadband: 0.01}
        do:
          burst: {cancel_sprint: true, fire: demon_mode, retaps: 3}
      - when:
          wall_collapse: {from_above: 0.3}
        do:
          burst: {cancel_sprint: true, fire: demon_mode, retaps: 3}
    # tournament_any_falling plus the fleet-mark Nuke.
    tournament_wall_nuke:
      label: Tournament Wall + Fleet Nuke
      arm: {'on': second_wind, immunity_sec: 8, watch_sec: null}
      end_sprint_after_sw: false
      rules:
      - when: {bar: wall, below: 0.5, falling_samples: 2, deadband: 0.01}
        do:
          burst: {cancel_sprint: true, fire: demon_mode, retaps: 3}
      - when:
          wall_collapse: {from_above: 0.3}
        do:
          burst: {cancel_sprint: true, fire: demon_mode, retaps: 3}
      - when:
          fleet_mark: {after_waves: 3, window_waves: 60}
        do:
          fire: {button: nuke, throttle_sec: 5}
  gather:
    # For a runner riding along on a HUMAN's run: no gem taps, no side flows.
    hands_off:
      flying_gem: false
      gem_delay_sec: [3, 10]
      ad_gems: false
      quests_8h: false
      quest_rewards: false
      guild: false
    all_on:
      flying_gem: true
      gem_delay_sec: [3, 10]
      ad_gems: true
      quests_8h: true
      quest_rewards: true
      guild: true
    gems_only:
      flying_gem: true
      gem_delay_sec: [3, 10]
      ad_gems: false
      quests_8h: false
      quest_rewards: false
      guild: false
  shopping_lists:
    no_utility_sweep:
      label: No-Utility Sweep (Dissonance)
      enabled: true
      directives:
      - enabled: true
        tab: defense
        stats: [death_defy, land_mine_radius]
        mode: once
      - enabled: true
        tab: defense
        stats: [health, health_regen]
        mode: best_cost
      - enabled: true
        tab: attack
        stats: [critical_factor, damage_per_meter, bounce_shot_range, super_crit_chance,
          super_crit_mult]
        mode: once
      - enabled: true
        tab: attack
        stats: [damage]
        mode: clicks
        clicks: 3
    default_sweep:
      label: Default Sweep
      enabled: true
      directives:
      - enabled: true
        tab: utility
        stats: [enemy_attack_level_skip, enemy_health_level_skip]
        mode: repeat
      - enabled: true
        tab: defense
        stats: [death_defy, land_mine_radius]
        mode: once
      - enabled: true
        tab: defense
        stats: [health, health_regen]
        mode: best_cost
      - enabled: true
        tab: attack
        stats: [critical_factor, damage_per_meter, bounce_shot_range, super_crit_chance,
          super_crit_mult]
        mode: once
      - enabled: true
        tab: attack
        stats: [damage]
        mode: clicks
        clicks: 3
  chores:
  - {name: quest_scan, enabled: true}
  - {name: shatter, enabled: false}
# The day plan: shards from 08:00, coin the rest of the day, one tournament
# entry from 19:00 on Wednesday and Saturday (the game's tournament days).
plan:
  week: {default: farm_day, wednesday: tourney_day, saturday: tourney_day}
  days:
    farm_day:
    - {after: '08:00', block: shards, blueprint: shard_daily, count: 100}
    - {block: coin, blueprint: coin_default}
    tourney_day:
    - {block: tournament, blueprint: tourney_main, after: '19:00', count: 1}
    - {block: shards, blueprint: shard_daily, after: '08:00', count: 100}
    - {block: coin, blueprint: coin_default}
