name: CI
# Offline checks for every push and pull request on master and the dashboard
# branch. No job needs a secret, the emulator, adb or a live port: the backend
# suite fakes all of them (backend/tests/conftest.py refuses 5037, 8620, 8630).
# Nothing here is a required check; branch protection is not touched.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend unit tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      # Two commands: pip refuses a bare requirement beside a hash-locked file
      # (--require-hashes), so pytest is never installed with the lock.
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-portable.lock
      - name: Install pytest
        run: python -m pip install pytest==9.1.1
      # The three contract modules run in the contract-drift job, not twice.
      - name: Run backend unit tests
        run: >-
          python -m pytest backend/tests/unit
          --ignore=backend/tests/unit/test_dashboard_contract.py
          --ignore=backend/tests/unit/test_dashboard_contract_pages.py
          --ignore=backend/tests/unit/test_harvest_contract.py
  contract-drift:
    name: Contract drift
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-portable.lock
      - name: Install pytest
        run: python -m pip install pytest==9.1.1
      # Route answers against the recorded fixtures the dashboard app is generated from.
      - name: Run contract tests
        run: >-
          python -m pytest
          backend/tests/unit/test_dashboard_contract.py
          backend/tests/unit/test_dashboard_contract_pages.py
          backend/tests/unit/test_harvest_contract.py
  frontend:
    name: Dashboard app
    runs-on: windows-latest
    # The unit suite alone takes about 25 minutes on a hosted runner; 30 cancelled a normal run at 30:05.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Unit tests only. The browser suite (npm run e2e) is not run in CI yet.
      - name: Unit tests
        run: npx vitest run