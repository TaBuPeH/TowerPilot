name: Build and publish beta
on:
  push:
    tags: ['v*']
    branches: [master]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check version
        shell: pwsh
        run: |
          $tag = "v$((Get-Content VERSION -Raw).Trim())"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $tag -ne $env:GITHUB_REF_NAME) { throw 'Tag and VERSION differ' }
          # --force: on a tag push the checkout already holds the tag and a
          # plain fetch of an annotated tag is rejected as "would clobber"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist' }
          git checkout --detach $tag
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check out release tag' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
      # Two steps: pip refuses a bare requirement beside the hash-locked file.
      - name: Install build dependencies
        run: python -m pip install -r requirements-portable.lock
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1
      - name: Select backend release tests by layout
        shell: pwsh
        run: |
          foreach ($file in @('test_release_clean.py', 'test_release_bootstrap.py', 'test_release_app_build.py', 'test_ui_app_serving.py')) {
            $moved = "backend/tests/unit/$file"
            $selected = if (Test-Path $moved) { $moved } else { "backend/tests/$file" }
            $key = $file.Replace('.py', '').ToUpperInvariant()
            "$key=$selected" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - name: Check source release boundary
        run: python -m pytest $env:TEST_RELEASE_CLEAN $env:TEST_RELEASE_BOOTSTRAP
      # The dashboard app (frontend/app, ADR-001), built before the ZIPs. One
      # step per command so any failure stops the release. The steps run when
      # the checked-out release has the app; a tag from before it has none,
      # and from it on tools/build_release.py refuses a release without the build.
      - name: Check dashboard app release boundary
        if: hashFiles('frontend/app/package-lock.json') != ''
        run: python -m pytest $env:TEST_RELEASE_APP_BUILD $env:TEST_UI_APP_SERVING
      - name: Install dashboard app dependencies
        if: hashFiles('frontend/app/package-lock.json') != ''
        working-directory: frontend/app
        run: npm ci
      - name: Typecheck dashboard app
        if: hashFiles('frontend/app/package-lock.json') != ''
        working-directory: frontend/app
        run: npm run typecheck
      - name: Lint dashboard app
        if: hashFiles('frontend/app/package-lock.json') != ''
        working-directory: frontend/app
        run: npm run lint
      - name: Test dashboard app
        if: hashFiles('frontend/app/package-lock.json') != ''
        working-directory: frontend/app
        run: npm test
      - name: Build dashboard app
        if: hashFiles('frontend/app/package-lock.json') != ''
        working-directory: frontend/app
        run: npm run build
      - name: Build source distribution
        run: python tools/build_release.py
      - name: Build portable distribution
        run: python tools/build_portable.py
      - name: Check release archives
        if: hashFiles('frontend/app/package-lock.json') != ''
        run: python tools/check_release_zips.py
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.zip(\.sha256)?$' } | ForEach-Object { $_.FullName }
          # A tag push and a master push can both build the same version:
          # the first run creates the release, a later one refreshes its assets.
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --prerelease --title "Tower Pilot $((Get-Content VERSION -Raw).Trim())" --notes-file docs/GITHUB_RELEASE.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
